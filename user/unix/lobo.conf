# px34: the configuration lobo's own status client reads in
# tests/mpx4-unix (only `pid` and `control` matter to it; the rest is
# lobo's default shape, as `lobo -t` accepts it).
worker_processes 1;
pid logs/lobo.pid;
error_log logs/error.log;
control unix:logs/control.sock;
events {
    worker_connections 1024;
}
http {
    types {
        text/html  html htm;
        text/plain txt;
    }
    default_type application/octet-stream;
    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        root html;
        index index.html;
    }
}
