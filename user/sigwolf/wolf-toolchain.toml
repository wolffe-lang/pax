# sigwolf's toolchain (px53): the shape su pins with, read by
# tools/mksigwolf as su's builder (mksu) reads su's. The probe is of what wolf
# 0.2.33 asks of PAX (s246's five calls, `os_signal_text(0)`), so it is
# built by 0.2.33 whatever the kernel's own pin (kernel/wolf.pin) says:
# a kernel built at another pin is held to the same probe. wolf 0.2.33
# from its release archive BY DIGEST (release 417610226, wolf-lang
# 85dab5d7; the digest read twice from the release API and again by
# sha256sum of the download on kasumi), and wolf-std cceda63, the
# archive's bundled std (the probe uses none of it). px57 moves it to
# wolf 0.2.34 (release 419552903, wolf-lang 9da7bdcf; the digest read
# twice from the release API and again by sha256sum of the download on
# kasumi) and wolf-std 3bacc5f, with every user program: its rows are
# 0.2.33's calls, which 0.2.34 answers as 0.2.33 did (CHANGELOG), so a
# moved row is a finding, not a re-recording.
[wolf]
version = "0.2.34"
repo = "wolffe-lang/wolf-lang"
rev = "9da7bdcf2aea9adf48df6570bedc58e16e9ef853"
version_line = "wolf 0.2.34 (wolfgang, pin 9da7bdc)"
x86_64-unknown-linux-gnu = "88a9dd3da1c9a0e38c08eb6e2de9c1ef04d1ed93dcf51024d8dbbb76890c1821"

[std]
repo = "wolffe-lang/wolf-std"
