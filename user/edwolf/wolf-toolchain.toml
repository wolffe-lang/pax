# edwolf's toolchain (px57): sigwolf's shape (px53), read by
# tools/mkedwolf as mksigwolf reads sigwolf's. The probe is of what wolf
# 0.2.34 asks of PAX (s247's os_fork, s248's six calls and the mode
# bits), so it is built by 0.2.34 whatever the kernel's own pin
# (kernel/wolf.pin) says: a kernel built at another pin is held to the
# same probe. wolf 0.2.34 from its release archive BY DIGEST (release
# 419552903, wolf-lang 9da7bdcf; the digest read twice from the release
# API and again by sha256sum of the download on kasumi), and wolf-std
# 3bacc5f (sc69's merge, the next STD-PIN; the probe uses none of it).
# px65 (2026-10-23) moves it to wolf 0.2.35 (release 421613621, wolf-lang
# cf0c13d3; the digest read twice from the release API and again by
# sha256sum of the download on kasumi) and wolf-std 78b9d3c: the probe
# still asks 0.2.34's calls, held to the same recordings.
[wolf]
version = "0.2.35"
repo = "wolffe-lang/wolf-lang"
rev = "cf0c13d38479f444b69bb8356ad5709d07eff323"
version_line = "wolf 0.2.35 (wolfgang, pin cf0c13d)"
