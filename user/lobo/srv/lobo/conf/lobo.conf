# px47 (tests/mpx4-lobo, session serve-user): lobo run AS lobo (990,
# ruling #75 R3) in its own home, /srv/lobo, on a port above 1023, with
# nginx's `user` directive. lobo at pax's pin cannot drop privileges
# (lobo#52): as root it refuses the directive by name, as lobo it says
# nginx's warning and serves. @P<port>@ and @LISTEN@ are filled in per
# side as in ../../conf/lobo.conf.
user lobo;
worker_processes 1;
pid logs/lobo.pid;
error_log logs/error.log;
control unix:logs/control.sock;
events {
    worker_connections 1024;
}
http {
    types {
        text/html  html htm;
        text/plain txt;
    }
    default_type application/octet-stream;
    access_log logs/access.log;
    server {
        listen @LISTEN@:@P8000@;
        server_name localhost;
        root html;
        index index.html;
    }
}
