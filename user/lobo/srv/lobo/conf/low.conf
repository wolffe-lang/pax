# px47 (tests/mpx4-lobo, session serve-user): port 80, which a user (lobo,
# 990) may not bind: lobo is refused it (EACCES), on PAX and on Linux.
worker_processes 1;
pid logs/lobo.pid;
error_log logs/error.log;
control unix:logs/control.sock;
events {
    worker_connections 1024;
}
http {
    types {
        text/html  html htm;
        text/plain txt;
    }
    default_type application/octet-stream;
    access_log logs/access.log;
    server {
        listen @LISTEN@:80;
        server_name localhost;
        root html;
        index index.html;
    }
}
