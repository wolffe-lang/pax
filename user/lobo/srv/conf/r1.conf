# px25 (tests/mpx4-lobo): lobo's control differential rows on PAX
# (tools/lobo-control-differential in lobo's tree); copied to
# conf/live.conf at the prompt. @P<port>@ and @LISTEN@ per side.
pid logs/live.pid;
error_log logs/live.log;
control unix:logs/live.sock;
http {
    types {
        text/html html;
    }
    server {
        listen @LISTEN@:@P80@;
        root html;
        index index.html;
    }
}
