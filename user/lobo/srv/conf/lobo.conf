# px25 (tests/mpx4-lobo): @P<port>@, @LISTEN@ and @BACKEND@ are filled
# in per side (PAX: the guest port, 0.0.0.0, 10.0.2.2; Linux: a free
# port of the host, 127.0.0.1, 127.0.0.1).
worker_processes 1;
pid logs/lobo.pid;
error_log logs/error.log;
control unix:logs/control.sock;
events {
    worker_connections 1024;
}
http {
    types {
        text/html  html htm;
        text/plain txt;
    }
    default_type application/octet-stream;
    access_log logs/access.log;
    server {
        listen @LISTEN@:@P80@;
        server_name localhost;
        root html;
        index index.html;
    }
}
