# px25 (tests/mpx4-lobo): lobo's static differential rows
# (tests/differential/lobo.conf.in in lobo's tree), one lobo a
# `--- server` section (lobo serves its first server block only at this
# pin, docs/DRYRUN.md): d1 none, d2 `max_ranges 0`, d3 `max_ranges 1`,
# d4 the two `alias` rows'. @P<port>@ and @LISTEN@ per side.
pid logs/d4.pid;
error_log logs/d4.log;
control unix:logs/d4.sock;
http {
  types {
    text/html html;
  }
  server {
    listen @LISTEN@:@P8084@;
    root www;
    index index.html;
    location = /hello { alias www/index.html; }
  }
}
