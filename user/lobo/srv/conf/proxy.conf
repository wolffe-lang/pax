# px25 (tests/mpx4-lobo): lobo's proxy differential rows
# (tests/differential/lobo.proxy.conf.in in lobo's tree), the backend
# this host's port 18090 (PAX reaches the host as 10.0.2.2).
pid logs/proxy.pid;
error_log logs/proxy.log;
control unix:logs/proxy.sock;
http {
    resolver 127.0.0.1:5353 valid=30s;
    resolver_timeout 5s;
    server {
        listen @LISTEN@:@P8090@;
        location /keep/ {
            proxy_pass http://@BACKEND@:18090;
        }
        location /strip/ {
            proxy_pass http://@BACKEND@:18090/;
        }
        location /rewrite/ {
            proxy_pass http://@BACKEND@:18090/v2/;
        }
        location /xff/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass http://@BACKEND@:18090/;
        }
        location /slow/ {
            proxy_read_timeout 1s;
            proxy_pass http://@BACKEND@:18090/;
        }
    }
}
