# The account programs' toolchain (px106): su, sudo, passwd and login, and
# the test helper mkshadow, read by tools/mkauth as tools/mkpelt reads
# pelt's. One file for all four, because they share user/auth and its one
# binding to wolf-std's `$7$` hash (std.x.crypto.passwd, sc80). wolf 0.2.36
# from its release archive BY DIGEST (release 427033151; the digest read
# twice from the release API, 2026-11-07, and again by sha256sum of the
# download on the Linux build host), and wolf-std at the commit below,
# whose own toolchain is wolf 0.2.36 (vendor/tools.toml). Until px106,
# su and sudo pinned wolf 0.2.35 / wolf-std 78b9d3c in user/su and
# user/sudo; those files are gone. The kernel's own pin (kernel/wolf.pin)
# is separate and unchanged. The four programs declare none of 0.2.36's
# new prelude names (env_arg0, env_args_bytes).
#
# std.rev: wolf-std trunk d4a4d4c, sc80's base, which has no
# std/x/crypto/passwd yet (tools/mkauth refuses it by name); it moves to
# sc80's merge, the commit px106's records are taken at.
[wolf]
version = "0.2.36"
repo = "wolffe-lang/wolf-lang"
rev = "5adf3d91f75b3545ff8d38e5b6693b0b9f367a05"
version_line = "wolf 0.2.36 (wolfgang, pin 5adf3d9)"
x86_64-unknown-linux-gnu = "d383c74c8cd123b9d9dfaa268271d4f004294f85c2b230237d0ef07027d9500d"

[std]
repo = "wolffe-lang/wolf-std"
rev = "d4a4d4cab358e1e8c174f0206f9e13ad5cfe6c61"
