# limine-quiet.conf — boot/limine.conf with `quiet` on the kernel's
# command line (px96; Limine's `cmdline` key, as
# boot/limine-initramfs-quiet.conf has it): tests/mpx3-user boots
# kmain_user with it for U9 and U10, a program's -EFAULT and -EBADF
# answered with no line on a quiet console.
timeout: 0
quiet: yes

/PAX
    protocol: limine
    path: boot():/boot/pax
    cmdline: quiet
