# tests/mpx4-console-net.d/limine-nonet.conf (px105) — boot/limine-initramfs.conf
# with `nonet` on the kernel's command line: the console starts no network
# device, whatever the machine has (kmain_console's escape hatch for metal,
# honoured with or without `triage`).
timeout: 0
quiet: yes

/PAX
    protocol: limine
    path: boot():/boot/pax
    cmdline: nonet
    module_path: boot():/boot/initramfs.cpio
