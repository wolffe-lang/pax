# tests/mpx4-console-net.d/limine-nonet.conf (px105) — boot/limine-initramfs.conf
# with `triage nonet` on the kernel's command line: the console starts no
# network device, whatever the machine has (kmain_console's escape hatch,
# beside triage's nofb, noxhci, noblock and nosound).
timeout: 0
quiet: yes

/PAX
    protocol: limine
    path: boot():/boot/pax
    cmdline: triage nonet
    module_path: boot():/boot/initramfs.cpio
