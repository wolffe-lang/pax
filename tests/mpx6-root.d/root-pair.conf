# tests/mpx6-root.d/root-pair.conf (px67, R1): `root=254:2 rw`: the device's numbers as major:minor in decimal (bootparam(7); Linux 7.2.8 mounts vda2 so: measured).
# tools/mkdisk --root fills the placeholders with partition 2's GUID and
# its ext2 UUID.
timeout: 0
quiet: yes

/PAX
    protocol: limine
    path: boot():/boot/pax
    cmdline: root=254:2 rw
    module_path: boot():/boot/initramfs.cpio
