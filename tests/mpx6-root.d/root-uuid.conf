# tests/mpx6-root.d/root-uuid.conf (px67, R1): `root=UUID=@UUID@ rw`: the ext2 UUID (the Linux kernel alone refuses it, an initramfs serves it: a named drift).
# tools/mkdisk --root fills the placeholders with partition 2's GUID and
# its ext2 UUID.
timeout: 0
quiet: yes

/PAX
    protocol: limine
    path: boot():/boot/pax
    cmdline: root=UUID=@UUID@ rw
    module_path: boot():/boot/initramfs.cpio
