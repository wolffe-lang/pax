# tests/mpx6-root.d/root-name.conf (px67, R1): `root=vda2 rootfstype=ext3 rw`: a device's bare name, with rootfstype (px68: ext3, the root journalled; ext2 before).
# tools/mkdisk --root fills the placeholders with partition 2's GUID and
# its ext2 UUID.
timeout: 0
quiet: yes

/PAX
    protocol: limine
    path: boot():/boot/pax
    cmdline: root=vda2 rootfstype=ext3 rw
    module_path: boot():/boot/initramfs.cpio
