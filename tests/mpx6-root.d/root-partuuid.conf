# tests/mpx6-root.d/root-partuuid.conf (px67, R1): `root=PARTUUID=@PARTUUID@ rw`: the GPT partition's GUID (mkdisk's default spelling).
# tools/mkdisk --root fills the placeholders with partition 2's GUID and
# its ext2 UUID.
timeout: 0
quiet: yes

/PAX
    protocol: limine
    path: boot():/boot/pax
    cmdline: root=PARTUUID=@PARTUUID@ rw
    module_path: boot():/boot/initramfs.cpio
