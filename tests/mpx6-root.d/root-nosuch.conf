# tests/mpx6-root.d/root-nosuch.conf (px67, R1): `root=/dev/vda9 rw`: no such disk (with no initramfs: a panic by name; with one kept, the rescue).
# tools/mkdisk --root fills the placeholders with partition 2's GUID and
# its ext2 UUID.
timeout: 0
quiet: yes

/PAX
    protocol: limine
    path: boot():/boot/pax
    cmdline: root=/dev/vda9 rw
    module_path: boot():/boot/initramfs.cpio
