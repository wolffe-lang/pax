# tests/mpx6-root.d/root-dev.conf (px67, R1): `root=/dev/vda2 rw`: /dev/vda2, Linux's own spelling.
# tools/mkdisk --root fills the placeholders with partition 2's GUID and
# its ext2 UUID.
timeout: 0
quiet: yes

/PAX
    protocol: limine
    path: boot():/boot/pax
    cmdline: root=/dev/vda2 rw
    module_path: boot():/boot/initramfs.cpio
