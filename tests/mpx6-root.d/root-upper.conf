# tests/mpx6-root.d/root-upper.conf (px67, R1): `root=PARTUUID=@PARTUUID-UPPER@ rw`: the GUID in capitals (Linux reads either case: measured).
# tools/mkdisk --root fills the placeholders with partition 2's GUID and
# its ext2 UUID.
timeout: 0
quiet: yes

/PAX
    protocol: limine
    path: boot():/boot/pax
    cmdline: root=PARTUUID=@PARTUUID-UPPER@ rw
    module_path: boot():/boot/initramfs.cpio
