# tests/mpx6-root.d/root-ro.conf (px67, R1): `root=PARTUUID=@PARTUUID@ ro`: read-only (the table's / line then remounts it read-write).
# tools/mkdisk --root fills the placeholders with partition 2's GUID and
# its ext2 UUID.
timeout: 0
quiet: yes

/PAX
    protocol: limine
    path: boot():/boot/pax
    cmdline: root=PARTUUID=@PARTUUID@ ro
    module_path: boot():/boot/initramfs.cpio
