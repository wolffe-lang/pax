# tests/mpx6-root.d/root-hex.conf (px67, R1): `root=0xfe02 rw`: the device's numbers in hex, the major in the bits above the low byte (bootparam(7); Linux 7.2.8 mounts vda2 so: measured).
# tools/mkdisk --root fills the placeholders with partition 2's GUID and
# its ext2 UUID.
timeout: 0
quiet: yes

/PAX
    protocol: limine
    path: boot():/boot/pax
    cmdline: root=0xfe02 rw
    module_path: boot():/boot/initramfs.cpio
