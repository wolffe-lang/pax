# limine-net-peer.conf — limine.conf with `peer` on the kernel's command
# line (px21; Limine's `cmdline` key). kernel/kmain_net.lu reads it
# through the Executable Command Line request (kernel/boot_info): with
# `peer` it runs its exchange with tools/net-peer, the other end of a
# socket netdev, in place of the one with QEMU's user-mode gateway.
# tests/mpx4-net boots the network's kernel with it for its `peer` way.
timeout: 0
quiet: yes

/PAX
    protocol: limine
    path: boot():/boot/pax
    cmdline: peer
