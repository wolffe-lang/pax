# px77d: the metal triage stick (USB). Every entry boots the same kernel and live archive
# with `triage`: a box per early step in a band at the bottom of the screen, the firmware's
# handover in that band, and any fault drawn in large hex with a halt that never reboots.
# Entries 2-9 each turn one suspect off; TRIAGE.txt says which to try, in which order.
timeout: 15
verbose: yes

/1 PAX triage
    protocol: limine
    path: boot():/boot/pax
    module_path: boot():/boot/initramfs.cpio
    cmdline: triage

/2 PAX triage slow (each box held a second)
    protocol: limine
    path: boot():/boot/pax
    module_path: boot():/boot/initramfs.cpio
    cmdline: triage slow

/3 PAX triage stop at box 6 (PAX page tables live)
    protocol: limine
    path: boot():/boot/pax
    module_path: boot():/boot/initramfs.cpio
    cmdline: triage stop=6

/4 PAX triage nofb (no console on the screen)
    protocol: limine
    path: boot():/boot/pax
    module_path: boot():/boot/initramfs.cpio
    cmdline: triage slow nofb

/5 PAX triage fxsave (no XSAVE)
    protocol: limine
    path: boot():/boot/pax
    module_path: boot():/boot/initramfs.cpio
    cmdline: triage slow fxsave

/6 PAX triage low4g (no RAM above 4 GiB)
    protocol: limine
    path: boot():/boot/pax
    module_path: boot():/boot/initramfs.cpio
    cmdline: triage slow low4g

/7 PAX triage keeplint0 (APIC LINT0 left alone)
    protocol: limine
    path: boot():/boot/pax
    module_path: boot():/boot/initramfs.cpio
    cmdline: triage slow keeplint0

/8 PAX triage noxhci noblock nosound (no USB, disk or sound drivers)
    protocol: limine
    path: boot():/boot/pax
    module_path: boot():/boot/initramfs.cpio
    cmdline: triage slow noxhci noblock nosound

/9 PAX triage everything off
    protocol: limine
    path: boot():/boot/pax
    module_path: boot():/boot/initramfs.cpio
    cmdline: triage slow nofb fxsave low4g keeplint0 noxhci noblock nosound

/10 PAX triage fault test (a deliberate fault at box 3)
    protocol: limine
    path: boot():/boot/pax
    module_path: boot():/boot/initramfs.cpio
    cmdline: triage fault=3

/11 PAX live, no triage (the px77b stick's boot)
    protocol: limine
    path: boot():/boot/pax
    module_path: boot():/boot/initramfs.cpio
