# limine-initramfs.conf — boot the image's kernel at once, with the
# initramfs as its one module (px10: tools/mkimage --conf this --add
# INITRAMFS initramfs.cpio). The kernel finds it through the module
# request (boot/start.S) and reads it in place (kernel/initramfs).
timeout: 0
quiet: yes

/PAX
    protocol: limine
    path: boot():/boot/pax
    module_path: boot():/boot/initramfs.cpio
