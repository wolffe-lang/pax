# limine-vt.conf — px59: limine-initramfs.conf asking for a 640 x 400
# framebuffer, so PAX's screen is the 80 x 25 grid of a Linux VT's text
# console (tests/mpx5-screen holds its cells to the VT's). Limine gives
# it under the BIOS; under OVMF the firmware's mode stands (1280 x 800).
timeout: 0
quiet: yes

/PAX
    protocol: limine
    path: boot():/boot/pax
    module_path: boot():/boot/initramfs.cpio
    resolution: 640x400
