# limine-initramfs-quiet.conf — limine-initramfs.conf with `quiet` on the
# kernel's command line (px15; Limine's `cmdline` key, CONFIG.md). The
# kernel reads it through the Executable Command Line request
# (boot/start.S, kernel/boot_info): with `quiet`, kernel/user prints no
# line for a program's ordinary life (its exec, its exit, a system call
# it is the first to try that PAX lacks, the frames count after a run);
# a refusal, a fault and a bad buffer still print. tests/mpx3-shell boots
# the shell image with it beside the one without.
timeout: 0
quiet: yes

/PAX
    protocol: limine
    path: boot():/boot/pax
    cmdline: quiet
    module_path: boot():/boot/initramfs.cpio
