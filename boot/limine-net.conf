# limine-net.conf — limine.conf with `pci` and `ping` on the kernel's
# command line (px20, px21; Limine's `cmdline` key). kernel/kmain_net.lu
# reads it through the Executable Command Line request
# (kernel/boot_info): with `pci` it prints the PCI census (kernel/pci's
# `report`) before it starts the network; with `ping` it sends the
# gateway six echo requests and prints each round trip.
# tests/mpx4-net boots the network's kernel with it.
timeout: 0
quiet: yes

/PAX
    protocol: limine
    path: boot():/boot/pax
    cmdline: pci ping
