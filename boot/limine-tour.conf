# limine-tour.conf — the menu of the tour of the kernel (px08, tools/tour).
# Two entries, the same stages and a different ending; the menu is shown
# on the serial console too (`serial: yes`), so a terminal running QEMU
# with `-serial stdio` sees it and can choose with the arrow keys and
# Enter. Without a key the default entry boots when the timeout runs
# out (tools/tour writes a copy with `default_entry: 2` for ending b's
# image).
timeout: 5
serial: yes
default_entry: 1
interface_branding: PAX, a tour of the kernel

/PAX tour, ending a: a thread overruns its stack
    protocol: limine
    path: boot():/boot/pax

/PAX tour, ending b: the kernel writes to its own text
    protocol: limine
    path: boot():/boot/pax-text
