# limine-reel.conf — the boot reel's menu (px08, tools/reel). Two
# entries, the same stages and a different finale; the menu is shown on
# the serial console too (`serial: yes`), so a terminal running QEMU
# with `-serial stdio` sees it and can choose with the arrow keys and
# Enter. Without a key the default entry boots when the timeout runs
# out (tools/reel writes a copy with `default_entry: 2` for finale b's
# image).
timeout: 5
serial: yes
default_entry: 1
interface_branding: PAX, the boot reel

/PAX reel, finale a: a thread overruns its stack
    protocol: limine
    path: boot():/boot/pax

/PAX reel, finale b: the kernel writes to its own text
    protocol: limine
    path: boot():/boot/pax-text
