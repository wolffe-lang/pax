# USB live medium only; the ISO and installed disk configurations are unchanged.
# px87 (pax#246): `quiet` (px15's word, kernel/user): the live session prints
# no line for a program's ordinary life (its exec, its exit, a system call it
# is the first to try that PAX lacks), so the screen holds what the programs
# and the installer write; a refusal, a fault and a bad buffer still print.
# px118: Limine says how far it got (CONFIG.md, v12.9.1's global options):
# `verbose: yes` prints its additional information during boot, `serial:
# yes` mirrors its interface to a serial port where there is one, and the
# menu stays five seconds, so a screen that goes black before the menu is
# told apart from one that goes black after it.
timeout: 5
verbose: yes
serial: yes

/PAX live (root, no password)
    protocol: limine
    path: boot():/boot/pax
    cmdline: quiet
    module_path: boot():/boot/initramfs.cpio

# px93 (R-px93-1): the upgrade entry, chosen from the menu, never the
# default. `pax.upgrade` and the stick's own /pax/install-targets as a
# second module make kernel/fstab mount the listed disk's PAX root at
# /mnt/target for `pax-install --upgrade`; the entry above mounts nothing.
/PAX: upgrade the installed system
    protocol: limine
    path: boot():/boot/pax
    cmdline: quiet pax.upgrade
    module_path: boot():/boot/initramfs.cpio
    module_path: boot():/pax/install-targets
