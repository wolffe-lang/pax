# px77d: the bisection stick (USB). kasumi booted to `login:` under `triage` where the plain
# boot had reset. Each entry turns one of triage's own effects off (kernel/triage: noidt, nomce,
# nodraw, fullh), so the entry that resets names the effect the machine needs; BISECT.txt.
timeout: 15
verbose: yes

/1 PAX triage (the control: booted kasumi)
    protocol: limine
    path: boot():/boot/pax
    module_path: boot():/boot/initramfs.cpio
    cmdline: triage

/2 PAX triage nodraw (no boxes, no CR3 switch per step)
    protocol: limine
    path: boot():/boot/pax
    module_path: boot():/boot/initramfs.cpio
    cmdline: triage nodraw

/3 PAX triage fullh (the console the whole height)
    protocol: limine
    path: boot():/boot/pax
    module_path: boot():/boot/initramfs.cpio
    cmdline: triage fullh

/4 PAX triage nomce (CR4.MCE left clear)
    protocol: limine
    path: boot():/boot/pax
    module_path: boot():/boot/initramfs.cpio
    cmdline: triage nomce

/5 PAX triage noidt (no triage GDT/IDT)
    protocol: limine
    path: boot():/boot/pax
    module_path: boot():/boot/initramfs.cpio
    cmdline: triage noidt

/6 PAX triage with all four effects off
    protocol: limine
    path: boot():/boot/pax
    module_path: boot():/boot/initramfs.cpio
    cmdline: triage nodraw fullh nomce noidt

/7 PAX triage nodraw fullh (both screen effects off)
    protocol: limine
    path: boot():/boot/pax
    module_path: boot():/boot/initramfs.cpio
    cmdline: triage nodraw fullh

/8 PAX live, no triage (as entry 11 of the triage stick)
    protocol: limine
    path: boot():/boot/pax
    module_path: boot():/boot/initramfs.cpio
