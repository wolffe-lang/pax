# px77d: the fix stick (USB). Entry 1, the default, is the plain live boot with px77d's fix (PAX's
# IDT, the NMI and the machine check on their own stacks, and CR4.MCE as the kernel's first act);
# it boots by itself after the countdown, so repeated boots need no key. Entries 2 and 3 are the
# triage, in case. FIX.txt says what to do and what to send back.
timeout: 5

/1 PAX live (px77d: the IDT first)
    protocol: limine
    path: boot():/boot/pax
    module_path: boot():/boot/initramfs.cpio

/2 PAX triage
    protocol: limine
    path: boot():/boot/pax
    module_path: boot():/boot/initramfs.cpio
    cmdline: triage

/3 PAX triage slow
    protocol: limine
    path: boot():/boot/pax
    module_path: boot():/boot/initramfs.cpio
    cmdline: triage slow
