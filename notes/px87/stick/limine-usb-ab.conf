# px87's metal stick only (R-px87-3): boot/limine-usb.conf at the lane's head, and a second entry, the same
# kernel and archive with `fbread` (px19's scroll, which reads the framebuffer back), so one stick times the
# boot both ways on kasumi's GPU (pax#253). The repository's own boot/limine-usb.conf has the first entry alone.
timeout: 3

/PAX live (root, no password)
    protocol: limine
    path: boot():/boot/pax
    cmdline: quiet
    module_path: boot():/boot/initramfs.cpio

/PAX live, the old scroll (fbread: px87's measurement only)
    protocol: limine
    path: boot():/boot/pax
    cmdline: quiet fbread
    module_path: boot():/boot/initramfs.cpio
