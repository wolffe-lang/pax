            build/mpx3-shell/*/kmain_console.elf
            build/mpx3-shell/*/*.log
            build/mpx3-shell-*.session
            build/mpx3-shell-*.session.linux
            build/mpx3-shell-*.log
            build/mpx3-shell-*.norm
            build/mpx3-shell-*.meta
            build/mpx3-shell-*.halt
            build/mpx3-shell-*.verdict
            build/mpx3-shell-*.typed
            build/mpx3-shell-runs.txt
