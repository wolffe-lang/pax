# pax — CI.
#
# The harness proof on every push to trunk and every pull request:
# build the assembly stub, wrap it in the Limine ISO, boot it under
# SeaBIOS and OVMF, assert the serial log and QEMU's exit status, and
# stop it under gdb at _start. Then a macOS job boots the SAME ISO with
# Homebrew's QEMU, so the harness's macOS claim is measured, not stated.
#
# The `mkw` job is M-KW (kw05): the first wolf kernel, built by the wolf
# kernel/wolf.pin names, booted the same way. The pin is the wolf
# release archive, fetched and checked by digest on every run, never
# cached and never built (px05: 0.2.23; px02 and kw10 built wolf-lang
# from source, and cached the build, while no release carried kw06-kw09).
#
# QEMU, OVMF, xorriso and gdb come from the distro (apt) and Homebrew;
# Limine comes from its release archive BY DIGEST (tools/fetch-limine
# refuses on a mismatch). Every step runs bare and its exit code is read
# directly: no pipes, so nothing masks a failure.
#
# THE TIERS (px37, tl29). A run of every suite on every leg is 34 jobs
# and about 450 job-minutes (the last ten before 2026-10-20's plan
# change: notes/tl29-the-second-diet.md), and before px37 every push of
# every lane paid all of it. So the `plan` job (tools/ci-plan, proven by
# tests/ci-plan) decides which suites a run runs and on which legs (a
# leg: one compiler tier on one firmware), and every other job reads its
# answer:
#
#   all   every suite on every leg (native and release, BIOS and UEFI):
#         a push to trunk, the nightly `schedule`, a `workflow_dispatch`
#         (unless its `tier` input says full or pr), and a pull request
#         whose change touches the toolchain pins, the harness every boot
#         goes through or the kernel's entry, link script or Limine
#         configuration (the FULL rules of tools/ci-tiers.map), labelled
#         or not.
#   full  THE MERGE GATE (tl29): every suite on the merge legs,
#         `--tier native --firmware bios`: a pull request labelled
#         `full-matrix`, and `-f tier=full`. In the last 60 full runs no
#         leg caught a red native BIOS missed but for a harness race
#         (notes/tl29-the-second-diet.md §4), so native UEFI and release
#         BIOS and UEFI run after the merge: on the trunk push, within the
#         hour, and every night.
#   pr    any other pull-request run: the suites the change can affect
#         (tools/ci-tiers.map and the tests' own text), each on ONE leg,
#         `--tier native --firmware bios`. A change to the kernel's core
#         or to CI itself can affect every suite: it runs all of them, on
#         that one leg (px40, ruling #76). Nothing changed: no suite
#         dropped, none narrowed — a suite is left out of a PR run, or
#         run on fewer legs there, and runs in full after the merge.
#   partial  a dispatch naming suites (`-f suites=...`, a plant), on its
#         `tier` input's legs.
#   noop  a `labeled` event for any label but `full-matrix`.
#
# THE MERGE RULE: a lane's PR is merged only with a green `tier full`
# (or `tier all`, which runs everything `tier full` does) at its head. A
# lane gets one by adding the `full-matrix` label when the head is the
# one to merge (a later push to a labelled PR runs full again). The
# `tier` job, last, is named for the tier, checks the tier's shape (every
# suite on its legs, for `all` and `full`), that every suite the plan
# chose succeeded and every other was skipped, and is what says which
# tier a run was. A red nightly opens an issue (`nightly-red`,
# tools/nightly-red) that the next lane on pax owes.

name: ci

on:
  push:
    branches: [trunk]
  pull_request:
    # `labeled` so adding `full-matrix` starts the full run at once; any
    # other label's run is a noop (the plan, then nothing).
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Nightly, the all tier (every suite, every leg), on trunk; a red one
    # opens an issue (the `tier` job's last step).
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "all: every leg; full: the merge gate's legs and pr: --tier native --firmware bios"
        type: choice
        options: [all, full, pr]
        default: all
      suites:
        description: "the suites (job names, space-separated; tier partial on the tier's legs); empty: every suite"
        type: string
        default: ""
      pelt_cases:
        description: "mpx5-pelt only: named replay cases; empty runs every case (plants may name corpus)"
        type: string
        default: ""
      jobs_boots:
        description: "mpx5-jobs only (px52, pax#85): its boots, as PAX_JOBS_BOOTS (e.g. 'pjobs:serial groups:serial'); empty: every boot"
        type: string
        default: ""
      ways:
        description: "mpx4-ready only (px55, pax#91): its ways, as PAX_READY_WAYS (e.g. 'peer user'); empty: every way"
        type: string
        default: ""
      wolf_plant:
        description: "mpx5-wolf only: deliberate glibc or std-root break; empty is the control"
        type: string
        default: ""

permissions:
  contents: read

# A pull request's runs: one group per branch and tier, cancel-in-progress,
# so a new push frees the slots of the run it supersedes. The full run
# and the pr run live in SEPARATE groups (adding the label must not cancel
# the pr run at the same head), and another label's noop run gets a group
# of its own so it cancels nothing. Every other run (a trunk push, the
# nightly, a dispatch) gets a group of its own run id: never cancelled,
# and never replaced while pending, since each trunk push's all run is
# the coverage that merge is owed (since tl29 the only one of three legs
# before the nightly).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}-{1}', github.head_ref, (github.event.action == 'labeled' && github.event.label.name != 'full-matrix') && format('noop-{0}', github.run_id) || (contains(github.event.pull_request.labels.*.name, 'full-matrix') && 'full' || 'pr')) || format('ci-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which suites this run runs, and on which legs (THE TIERS, above),
  # decided once and printed path by path, so a run's log says why it
  # has the jobs it has. The planner's own proof runs first.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      suites: ${{ steps.plan.outputs.suites }}
      legs: ${{ steps.plan.outputs.legs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: the planner can say no (tests/ci-plan)
        run: tests/ci-plan

      - name: the plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
          IN_TIER: ${{ inputs.tier }}
          IN_SUITES: ${{ inputs.suites }}
        run: tools/ci-plan --github-output "$GITHUB_OUTPUT"

  proof:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'proof')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, gdb (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso gdb
          qemu-system-x86_64 --version
          xorriso -version 2>&1 | head -n 1
          ls -l /usr/share/OVMF/

      - uses: actions/cache@v4
        with:
          path: .pax-cache
          key: limine-${{ hashFiles('boot/limine.pin') }}

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: expect-serial can say no
        run: tests/expect-serial-selftest

      - name: the proof, BIOS and UEFI
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/proof

      - name: the proof's ISO, by digest
        run: |
          sha256sum build/pax-stub.iso > build/pax-stub.iso.sha256
          cat build/pax-stub.iso.sha256

      - name: gdb stops at _start (BIOS)
        run: tests/gdb-attach --firmware bios

      - name: gdb stops at _start (UEFI)
        run: tests/gdb-attach --firmware uefi

      - name: keep the image and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-proof-linux
          path: |
            build/pax-stub.iso
            build/pax-stub.iso.sha256
            build/stub/pax-stub.elf
            build/*.log
            build/*.meta
            build/*.out
          retention-days: 14
          if-no-files-found: warn

  macos-run:
    needs: [plan, proof]
    if: contains(fromJSON(needs.plan.outputs.suites), 'macos-run')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pax-proof-linux
          path: build

      - name: the very ISO the linux proof booted
        run: shasum -a 256 -c build/pax-stub.iso.sha256

      - name: qemu (Homebrew)
        run: |
          brew install qemu
          qemu-system-x86_64 --version

      - name: the proof on the linux-built ISO, BIOS and UEFI
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/proof --image build/pax-stub.iso

  # M-KW (kw05, kw00 §3e): a freestanding wolf kernel, built by the wolf
  # kernel/wolf.pin names on both tiers, linked with the Limine boot
  # path, booted under SeaBIOS and OVMF: serial ends `KWC`, status 33;
  # the trap kernel ends `TRAP 1`, status 3; the machines' refusals as
  # recorded; and the seen-red variants (no --target; KWD) refused in the
  # same run. Every step bare, exit codes read directly.
  mkw:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mkw')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
            .pax-cache/lupin-*
          key: mkw-${{ hashFiles('boot/limine.pin', 'kernel/wolf.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: lupin at the pin (by digest)
        run: |
          bin=$(tools/fetch-lupin)
          echo "PAX_LUPIN=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: expect-serial can say no (incl. --tail)
        run: tests/expect-serial-selftest

      - name: M-KW, the plan's legs (all four in the all tier)
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mkw $PAX_LEGS

      - name: keep the kernels and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mkw-linux
          path: |
            build/mkw/
            build/mkw-*.log
            build/mkw-*.meta
            build/mkw-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # M-PX1 (px01): first light. The wolf kernel (kernel/), built by the
  # pinned wolf on both tiers, booted under SeaBIOS and OVMF:
  # its transcript (A2), its halt proven through QEMU's monitor (A3), the
  # panic kernel's `PANIC <kind> <file>:<line>` and halt (A4, A5), and a
  # spinning kernel refused by the halt probe in the same run (A6).
  mpx1:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx1')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx1-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: expect-serial can say no (incl. --tail, --regex)
        run: tests/expect-serial-selftest

      - name: M-PX1, the plan's legs (all four in the all tier)
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx1 $PAX_LEGS

      - name: keep the kernels, the transcripts and the halt probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx1-linux
          path: |
            build/mpx1/
            build/mpx1-*.log
            build/mpx1-*.meta
            build/mpx1-*.halt
            build/mpx1-*.verdict
            build/mpx1-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px04: the syscall census's own tools. tests/census proves tally.py's
  # attribution on a hand-written strace fixture (C1), that the committed
  # union, milestone tables and docs/CENSUS.md are exactly what the
  # committed tallies generate (C2), and that every census call has a
  # number and a P3 lane (C3). No tracing here: the traces run in
  # containers on kasumi (tools/census/census).
  census:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'census')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: python
        run: python3 --version

      - name: the census tools, C1-C3
        run: tests/census

  # px02: physical frames. kernel/frames, built from Limine's memory map
  # by the pinned wolf on both tiers, booted under SeaBIOS and OVMF: the
  # totals against the map (F2), every frame handed out exactly once,
  # aligned, usable, above 1 MiB, outside the image and the allocator's
  # state (F3), written and read back through the HHDM (F4), freed and
  # handed out again (F5), and a double free and a free of a frame never
  # usable each panicking by name (F6, F7), every halt proven (F8).
  mpx2-frames:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx2-frames')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx2-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: physical frames, the plan's legs (all four in the all tier)
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx2-frames $PAX_LEGS

      - name: keep the kernels, the transcripts and the halt probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx2-frames-linux
          path: |
            build/mpx2/
            build/mpx2-*.log
            build/mpx2-*.meta
            build/mpx2-*.halt
            build/mpx2-*.verdict
            build/mpx2-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px03: paging. kernel/paging builds PAX's own four-level structures
  # from px02's frames and switches CR3 to them; tests/mpx2-paging reads
  # them back through QEMU's monitor on the halted machine (`info
  # registers`, `info tlb`, `xp /256gx $cr3`): the switch (G2), the
  # image's W^X per section (G3), the HHDM kept and nothing in the lower
  # half (G4), a map/unmap round trip (G6), the halt (G8). G7, the write
  # to text, moved to mpx2-interrupts I1 at kw10 (it now panics by name). px02's frame exercise on the new structures is the
  # mpx2-frames job's (G5).
  mpx2-paging:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx2-paging')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version
          readelf --version | head -n 1

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx2-paging-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: paging, the plan's legs (all four in the all tier)
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx2-paging $PAX_LEGS

      - name: keep the kernels, the transcripts, the monitor's answers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx2-paging-linux
          path: |
            build/mpx2-paging/
            build/mpx2-paging-*.log
            build/mpx2-paging-*.meta
            build/mpx2-paging-*.halt
            build/mpx2-paging-*.fault
            build/mpx2-paging-*.verdict
            build/mpx2-paging-*.regs
            build/mpx2-paging-*.cmd*
            build/mpx2-paging-*.int
            build/mpx2-paging-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # kw10: interrupts. The kernel's own GDT, TSS (IST1) and IDT; all 32
  # exceptions and the 8259's 16 lines through boot/isr.S's trampolines
  # to wolf (kernel/gdt, kernel/idt, kernel/interrupts); the timer
  # (kernel/apic, kernel/timer). tests/mpx2-interrupts: the trampolines'
  # shapes in the ELF (I0), a write to text panicking `page fault` with
  # CR2 (I1), `ud2` panicking `invalid opcode` (I2), `int3` returning
  # (I3), a double fault on IST1 (I4), 20 PIT ticks on vector 32 (I5),
  # the descriptor-table registers read back from the halted machine
  # (I6).
  mpx2-interrupts:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx2-interrupts')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version
          objdump --version | head -n 1

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx2-interrupts-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: interrupts, the plan's legs (all four in the all tier)
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx2-interrupts $PAX_LEGS

      - name: keep the kernels, the transcripts, the monitor's answers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx2-interrupts-linux
          path: |
            build/mpx2-interrupts/
            build/mpx2-interrupts-*.log
            build/mpx2-interrupts-*.meta
            build/mpx2-interrupts-*.halt
            build/mpx2-interrupts-*.verdict
            build/mpx2-interrupts-*.cmd*
            build/mpx2-interrupts-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px07: the scheduler. Kernel threads on one CPU, switched by the timer
  # (boot/isr.S's trampoline resumes the frame pax_interrupt returns),
  # each on a stack from frames with an unmapped guard (kernel/sched),
  # a spinlock on wolf's atomics (kernel/sync). tests/mpx2-sched: the
  # trampoline's shape (S0), three threads alternating by preemption
  # alone (S1), sleep waking on the tick (S2), exit reclaiming the stack
  # (S3), a locked counter exact where the unlocked control loses
  # updates (S4), a stack overflow into the guard panicking by name
  # (S5), the halt (S6).
  mpx2-sched:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx2-sched')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version
          objdump --version | head -n 1

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx2-sched-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: the scheduler, the plan's legs (all four in the all tier)
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx2-sched $PAX_LEGS

      - name: keep the kernels, the transcripts, the halt probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx2-sched-linux
          path: |
            build/mpx2-sched/
            build/mpx2-sched-*.log
            build/mpx2-sched-*.norm
            build/mpx2-sched-*.meta
            build/mpx2-sched-*.halt
            build/mpx2-sched-*.verdict
            build/mpx2-sched-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px06: the kernel heap. kernel/heap is wolf's allocator hook
  # (wolf_alloc, wolf_free; wolf-lang kw12) written in wolf over px02's
  # frames and px03's paging; kernel code allocates through wolf's
  # freestanding runtime (libwolf_rt_none.a, from the pinned archive).
  # tests/mpx2-heap: the archive linked (H1); the empty heap (H2); eight
  # rounds of a List, a Map with str keys, interpolation, a closure and
  # a nested region, every value checked (H3); no leak — live blocks
  # back to zero and the heap's pages and the free frames unchanged
  # after every round (H4); the halt (H5); a double free (H6), a free
  # outside the heap (H7), out of memory (H8) and a page fault in the
  # heap (H9) each panicking by name.
  mpx2-heap:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx2-heap')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx2-heap-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
