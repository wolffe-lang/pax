# pax — CI.
#
# The harness proof on every push to trunk and every pull request:
# build the assembly stub, wrap it in the Limine ISO, boot it under
# SeaBIOS and OVMF, assert the serial log and QEMU's exit status, and
# stop it under gdb at _start. Then a macOS job boots the SAME ISO with
# Homebrew's QEMU, so the harness's macOS claim is measured, not stated.
#
# The `mkw` job is M-KW (kw05): the first wolf kernel, built by the wolf
# kernel/wolf.pin names, booted the same way. The pin is the wolf
# release archive, fetched and checked by digest on every run, never
# cached and never built (px05: 0.2.23; px02 and kw10 built wolf-lang
# from source, and cached the build, while no release carried kw06-kw09).
#
# QEMU, OVMF, xorriso and gdb come from the distro (apt) and Homebrew;
# Limine comes from its release archive BY DIGEST (tools/fetch-limine
# refuses on a mismatch). Every step runs bare and its exit code is read
# directly: no pipes, so nothing masks a failure.

name: ci

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, gdb (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso gdb
          qemu-system-x86_64 --version
          xorriso -version 2>&1 | head -n 1
          ls -l /usr/share/OVMF/

      - uses: actions/cache@v4
        with:
          path: .pax-cache
          key: limine-${{ hashFiles('boot/limine.pin') }}

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: expect-serial can say no
        run: tests/expect-serial-selftest

      - name: the proof, BIOS and UEFI
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/proof

      - name: the proof's ISO, by digest
        run: |
          sha256sum build/pax-stub.iso > build/pax-stub.iso.sha256
          cat build/pax-stub.iso.sha256

      - name: gdb stops at _start (BIOS)
        run: tests/gdb-attach --firmware bios

      - name: gdb stops at _start (UEFI)
        run: tests/gdb-attach --firmware uefi

      - name: keep the image and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-proof-linux
          path: |
            build/pax-stub.iso
            build/pax-stub.iso.sha256
            build/stub/pax-stub.elf
            build/*.log
            build/*.meta
            build/*.out
          retention-days: 14
          if-no-files-found: warn

  macos-run:
    needs: proof
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pax-proof-linux
          path: build

      - name: the very ISO the linux proof booted
        run: shasum -a 256 -c build/pax-stub.iso.sha256

      - name: qemu (Homebrew)
        run: |
          brew install qemu
          qemu-system-x86_64 --version

      - name: the proof on the linux-built ISO, BIOS and UEFI
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/proof --image build/pax-stub.iso

  # M-KW (kw05, kw00 §3e): a freestanding wolf kernel, built by the wolf
  # kernel/wolf.pin names on both tiers, linked with the Limine boot
  # path, booted under SeaBIOS and OVMF: serial ends `KWC`, status 33;
  # the trap kernel ends `TRAP 1`, status 3; the machines' refusals as
  # recorded; and the seen-red variants (no --target; KWD) refused in the
  # same run. Every step bare, exit codes read directly.
  mkw:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
            .pax-cache/lupin-*
          key: mkw-${{ hashFiles('boot/limine.pin', 'kernel/wolf.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: lupin at the pin (by digest)
        run: |
          bin=$(tools/fetch-lupin)
          echo "PAX_LUPIN=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: expect-serial can say no (incl. --tail)
        run: tests/expect-serial-selftest

      - name: M-KW, both tiers, BIOS and UEFI
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mkw

      - name: keep the kernels and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mkw-linux
          path: |
            build/mkw/
            build/mkw-*.log
            build/mkw-*.meta
            build/mkw-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # M-PX1 (px01): first light. The wolf kernel (kernel/), built by the
  # pinned wolf on both tiers, booted under SeaBIOS and OVMF:
  # its transcript (A2), its halt proven through QEMU's monitor (A3), the
  # panic kernel's `PANIC <kind> <file>:<line>` and halt (A4, A5), and a
  # spinning kernel refused by the halt probe in the same run (A6).
  mpx1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx1-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: expect-serial can say no (incl. --tail, --regex)
        run: tests/expect-serial-selftest

      - name: M-PX1, both tiers, BIOS and UEFI
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx1

      - name: keep the kernels, the transcripts and the halt probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx1-linux
          path: |
            build/mpx1/
            build/mpx1-*.log
            build/mpx1-*.meta
            build/mpx1-*.halt
            build/mpx1-*.verdict
            build/mpx1-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px04: the syscall census's own tools. tests/census proves tally.py's
  # attribution on a hand-written strace fixture (C1), that the committed
  # union, milestone tables and docs/CENSUS.md are exactly what the
  # committed tallies generate (C2), and that every census call has a
  # number and a P3 lane (C3). No tracing here: the traces run in
  # containers on kasumi (tools/census/census).
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: python
        run: python3 --version

      - name: the census tools, C1-C3
        run: tests/census

  # px02: physical frames. kernel/frames, built from Limine's memory map
  # by the pinned wolf on both tiers, booted under SeaBIOS and OVMF: the
  # totals against the map (F2), every frame handed out exactly once,
  # aligned, usable, above 1 MiB, outside the image and the allocator's
  # state (F3), written and read back through the HHDM (F4), freed and
  # handed out again (F5), and a double free and a free of a frame never
  # usable each panicking by name (F6, F7), every halt proven (F8).
  mpx2-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx2-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: physical frames, both tiers, BIOS and UEFI
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx2-frames

      - name: keep the kernels, the transcripts and the halt probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx2-frames-linux
          path: |
            build/mpx2/
            build/mpx2-*.log
            build/mpx2-*.meta
            build/mpx2-*.halt
            build/mpx2-*.verdict
            build/mpx2-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px03: paging. kernel/paging builds PAX's own four-level structures
  # from px02's frames and switches CR3 to them; tests/mpx2-paging reads
  # them back through QEMU's monitor on the halted machine (`info
  # registers`, `info tlb`, `xp /256gx $cr3`): the switch (G2), the
  # image's W^X per section (G3), the HHDM kept and nothing in the lower
  # half (G4), a map/unmap round trip (G6), the halt (G8). G7, the write
  # to text, moved to mpx2-interrupts I1 at kw10 (it now panics by name). px02's frame exercise on the new structures is the
  # mpx2-frames job's (G5).
  mpx2-paging:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version
          readelf --version | head -n 1

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx2-paging-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: paging, both tiers, BIOS and UEFI
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx2-paging

      - name: keep the kernels, the transcripts, the monitor's answers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx2-paging-linux
          path: |
            build/mpx2-paging/
            build/mpx2-paging-*.log
            build/mpx2-paging-*.meta
            build/mpx2-paging-*.halt
            build/mpx2-paging-*.fault
            build/mpx2-paging-*.verdict
            build/mpx2-paging-*.regs
            build/mpx2-paging-*.cmd*
            build/mpx2-paging-*.int
            build/mpx2-paging-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # kw10: interrupts. The kernel's own GDT, TSS (IST1) and IDT; all 32
  # exceptions and the 8259's 16 lines through boot/isr.S's trampolines
  # to wolf (kernel/gdt, kernel/idt, kernel/interrupts); the timer
  # (kernel/apic, kernel/timer). tests/mpx2-interrupts: the trampolines'
  # shapes in the ELF (I0), a write to text panicking `page fault` with
  # CR2 (I1), `ud2` panicking `invalid opcode` (I2), `int3` returning
  # (I3), a double fault on IST1 (I4), 20 PIT ticks on vector 32 (I5),
  # the descriptor-table registers read back from the halted machine
  # (I6).
  mpx2-interrupts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version
          objdump --version | head -n 1

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx2-interrupts-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: interrupts, both tiers, BIOS and UEFI
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx2-interrupts

      - name: keep the kernels, the transcripts, the monitor's answers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx2-interrupts-linux
          path: |
            build/mpx2-interrupts/
            build/mpx2-interrupts-*.log
            build/mpx2-interrupts-*.meta
            build/mpx2-interrupts-*.halt
            build/mpx2-interrupts-*.verdict
            build/mpx2-interrupts-*.cmd*
            build/mpx2-interrupts-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px07: the scheduler. Kernel threads on one CPU, switched by the timer
  # (boot/isr.S's trampoline resumes the frame pax_interrupt returns),
  # each on a stack from frames with an unmapped guard (kernel/sched),
  # a spinlock on wolf's atomics (kernel/sync). tests/mpx2-sched: the
  # trampoline's shape (S0), three threads alternating by preemption
  # alone (S1), sleep waking on the tick (S2), exit reclaiming the stack
  # (S3), a locked counter exact where the unlocked control loses
  # updates (S4), a stack overflow into the guard panicking by name
  # (S5), the halt (S6).
  mpx2-sched:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version
          objdump --version | head -n 1

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx2-sched-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: the scheduler, both tiers, BIOS and UEFI
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx2-sched

      - name: keep the kernels, the transcripts, the halt probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx2-sched-linux
          path: |
            build/mpx2-sched/
            build/mpx2-sched-*.log
            build/mpx2-sched-*.norm
            build/mpx2-sched-*.meta
            build/mpx2-sched-*.halt
            build/mpx2-sched-*.verdict
            build/mpx2-sched-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px06: the kernel heap. kernel/heap is wolf's allocator hook
  # (wolf_alloc, wolf_free; wolf-lang kw12) written in wolf over px02's
  # frames and px03's paging; kernel code allocates through wolf's
  # freestanding runtime (libwolf_rt_none.a, from the pinned archive).
  # tests/mpx2-heap: the archive linked (H1); the empty heap (H2); eight
  # rounds of a List, a Map with str keys, interpolation, a closure and
  # a nested region, every value checked (H3); no leak — live blocks
  # back to zero and the heap's pages and the free frames unchanged
  # after every round (H4); the halt (H5); a double free (H6), a free
  # outside the heap (H7), out of memory (H8) and a page fault in the
  # heap (H9) each panicking by name.
  mpx2-heap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx2-heap-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: the heap, both tiers, BIOS and UEFI
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx2-heap

      - name: keep the kernels, the transcripts and the halt probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx2-heap-linux
          path: |
            build/mpx2-heap/*/*.elf
            build/mpx2-heap/*/*.iso
            build/mpx2-heap/*/*.log
            build/mpx2-heap-*.log
            build/mpx2-heap-*.meta
            build/mpx2-heap-*.halt
            build/mpx2-heap-*.verdict
            build/mpx2-heap-*.expect
            build/mpx2-heap-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px09: user mode (M-PX3's first step). Programs in ring 3, each in an
  # address space of its own (the user half private, the kernel half
  # shared), calling the kernel through `syscall` with Linux's x86-64
  # numbers (write 1, exit 60; anything else -ENOSYS) and returning by
  # `sysretq`; a fault in ring 3 kills the program by name and the kernel
  # goes on (kernel/user, boot/user.S, user/programs.S). tests/mpx3-user:
  # the trampolines' shapes (U0), STAR/LSTAR/FMASK, SMEP and SMAP (U1),
  # hello (U2), five faults killed by name (U3), write's bad pointers
  # -EFAULT (U4), two processes at once preempted in ring 3 (U5), a
  # program after them all and every frame given back (U6), the kernel
  # refused a user byte without STAC (U7) and a jump into a user page
  # (U8).
  mpx3-user:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version
          objdump --version | head -n 1

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx3-user-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: user mode, both tiers, BIOS and UEFI
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx3-user

      - name: keep the kernels, the transcripts, the halt probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx3-user-linux
          path: |
            build/mpx3-user/
            build/mpx3-user-*.log
            build/mpx3-user-*.norm
            build/mpx3-user-*.meta
            build/mpx3-user-*.halt
            build/mpx3-user-*.verdict
            build/mpx3-user-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px10: the ELF loader and the initramfs (M-PX3's next step). The
  # programs are user/elf/hello.S built here with the runner's gcc and
  # binutils (no libc), packed by tools/mkinitramfs, handed to
  # kmain_loader as a Limine module; hello's output on PAX is compared
  # byte for byte with its output on this runner's own Linux. tests/
  # mpx3-loader: the build (L0), the initramfs (L1), hello against Linux
  # (L2), the segments (L3), six refusals by name (L4), the FPU state per
  # thread (L5), the frames (L6), the halt (L7), and a wolf program
  # linked static against the runner's glibc run until PAX lacks what it
  # asks for (L8, the gap census); both tiers, BIOS and UEFI.
  mpx3-loader:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils, gcc, strace (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils gcc libc6-dev strace
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version
          gcc --version | head -n 1
          python3 --version
          uname -sr

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx3-loader-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: the census subject, a wolf program linked static (baseline glibc)
        run: |
          tools/mkwolf-hello build/wolf-hello
          file build/wolf-hello

      - name: the loader, both tiers, BIOS and UEFI
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx3-loader --wolf-hello build/wolf-hello

      - name: keep the kernels, the programs, the initramfs, the transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx3-loader-linux
          path: |
            build/mpx3-loader/
            build/mpx3-loader-linux/
            build/mpx3-loader-*.log
            build/mpx3-loader-*.norm
            build/mpx3-loader-*.meta
            build/mpx3-loader-*.halt
            build/mpx3-loader-*.verdict
            build/mpx3-loader-runs.txt
            build/mpx3-loader-*.census
            build/wolf-hello
          retention-days: 14
          if-no-files-found: warn

  # px12: M-PX3. Unmodified static x86-64 Linux programs on PAX:
  # boreutils (user/boreutils.pin's tree, built here by tools/mkboreutils
  # with the toolchain that tree pins, linked static against this
  # runner's glibc) and busybox-static's busybox (boreutils has no `ls`),
  # in the initramfs with a run list kmain_boreutils runs; the same
  # binaries run on this runner's Linux, chrooted in the same tree (sudo,
  # tools/linux-run), under strace too. tests/mpx3-boreutils: the build
  # (B0), the initramfs (B1), every command's output and exit status
  # byte-identical to Linux's (B2), every frame back (B3), -ENOSYS only
  # for set_robust_list and rseq (B4), the halt (B5); both tiers, BIOS
  # and UEFI.
  mpx3-boreutils:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils, gcc, strace, busybox-static (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils gcc libc6-dev strace busybox-static
          qemu-system-x86_64 --version
          clang --version
          gcc --version | head -n 1
          dpkg -s libc6 busybox-static | grep -E '^(Package|Version):'
          uname -sr

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx3-boreutils-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: M-PX3, both tiers, BIOS and UEFI
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx3-boreutils

      - name: keep the programs, the Linux side, the transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx3-boreutils-linux
          path: |
            build/mpx3-boreutils/bore/
            build/mpx3-boreutils/bore.txt
            build/mpx3-boreutils/linux/
            build/mpx3-boreutils/linux.txt
            build/mpx3-boreutils/initramfs.txt
            build/mpx3-boreutils/*/kmain_boreutils.elf
            build/mpx3-boreutils/*/*.log
            build/mpx3-boreutils-*.out/
            build/mpx3-boreutils-*.log
            build/mpx3-boreutils-*.norm
            build/mpx3-boreutils-*.meta
            build/mpx3-boreutils-*.halt
            build/mpx3-boreutils-*.verdict
            build/mpx3-boreutils-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px08: the tour of the kernel. kmain_tour and kmain_tour_text
  # (kernel/pax_tour's stages over the test kernels' paths), two ISOs behind
  # Limine's menu (tools/tour build), both tiers, BIOS and UEFI.
  # tests/tour: the build (R0), the stages in order (R1), the frame round
  # trip (R2), W^X read back from the live tables (R3), four named threads
  # interleaved and joined (R4), ending (a) a stack overflow and (b) a
  # write to text, each panicking by name and halted (R5, R6), the pauses
  # (R7).
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version
          python3 --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: tour-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: the tour, both tiers, BIOS and UEFI
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/tour

      - name: keep the ISOs, the transcripts, the timings, the halt probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-tour-linux
          path: |
            build/tour/
            build/tour-*.log
            build/tour-*.norm
            build/tour-*.times
            build/tour-*.meta
            build/tour-*.halt
            build/tour-*.verdict
            build/tour-runs.txt
          retention-days: 14
          if-no-files-found: warn
