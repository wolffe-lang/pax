  # px20, px21: the network, toward M-PX4. kernel/kmain_net finds
  # QEMU's virtio network device on the PCI bus (kernel/pci), drives it
  # through the virtio 1.x interface (kernel/virtio, kernel/net),
  # resolves addresses through an ARP cache (kernel/arp), speaks IPv4
  # (kernel/ip) and answers and sends ICMP echo (kernel/icmp).
  # tests/mpx4-net, both tiers, BIOS and UEFI: what this runner's QEMU
  # gateway answers (G0, tools/gateway-probe); against the user-mode
  # gateway, a transitional and a 1.x-only device — the census (N1),
  # the device up (N2), a request answered (N3), the gateway in the
  # cache (N4), six pings (N12), 10000 echoes with the books flat (N6),
  # 25000 frames in two bursts (N7); against tools/net-peer on a socket
  # netdev — the pending queue, the route, the retry, the ageing, echo
  # requests into PAX answered byte for byte, the malformed dropped by
  # name, destination unreachable, 10000 echoes (P1-P4); for all three,
  # QEMU's filter-dump capture rebuilt byte by byte with every checksum
  # recomputed (N5), the kernel's counters against it (N8) and the halt
  # (N9); no device (N10) and a legacy-only device (N11), each one
  # named line and no panic. Since px22 a UDP datagram for a port no
  # socket holds draws a port unreachable (this kernel makes no
  # socket); the sockets themselves are the mpx4-udp job's.
  mpx4-net:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx4-net')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version
          python3 --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx4-net-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      # What this runner lets an unprivileged process do with ICMP: the
      # user-mode gateway can answer for an outside address only where
      # this range admits the runner's group (printed, not held).
      - name: the runner's ICMP policy
        run: cat /proc/sys/net/ipv4/ping_group_range

      - name: the network, the plan's legs (all four in the full tier)
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx4-net $PAX_LEGS

      - name: keep the kernels, the transcripts, the captures and the halt probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx4-net-linux
          path: |
            build/mpx4-net/*/*.elf
            build/mpx4-net/*/*.iso
            build/mpx4-net/*/*.log
            build/mpx4-net-*.log
            build/mpx4-net-*.meta
            build/mpx4-net-*.halt
            build/mpx4-net-*.verdict
            build/mpx4-net-*.expect
            build/mpx4-net-*.pcap
            build/mpx4-net-*.check
            build/mpx4-net-*.counters
            build/mpx4-net-*.peer
            build/mpx4-net-gateway-probe.txt
            build/mpx4-net-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px22: UDP and the socket system calls. Eight static Linux programs
  # (user/net, built here by tools/mknet against this runner's glibc)
  # run unmodified on kernel/kmain_sockets from the initramfs: what
  # AF_INET datagram sockets answer with nothing on the wire, a client
  # and a server over loopback, a UDP echo server, a client, a soak
  # each way, a stub resolver, a receive queue filled past its bound
  # over loopback and one from the wire.
  # tests/mpx4-udp, both tiers, BIOS and UEFI, two ways: against
  # tools/net-peer --udp on a socket netdev (the whole network, every
  # frame held to its bytes) and against QEMU's user-mode network with
  # tools/udp-host at this runner's end and QEMU's own DNS server. The
  # reference side is the same binaries on this runner's Linux in a
  # network namespace addressed as PAX is, the same net-peer script on a
  # tap device (sudo, tools/linux-net), under strace. What this runner's
  # QEMU DNS answers for an outside name (G1); the build and the Linux
  # side (U0); the stack up (U1); every program's output and exit
  # status byte-identical to Linux's (U2); every frame, descriptor and
  # socket back (U3); -ENOSYS and refusals as named (U4); the other
  # end's verdict (U5); the capture rebuilt byte by byte and the
  # kernel's counters against it (U6); the counters exactly (U7); 10000
  # datagrams each way (U8); the halt (U9).
  mpx4-udp:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx4-udp')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils, gcc, strace (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils gcc libc6-dev strace
          qemu-system-x86_64 --version
          clang --version
          gcc --version | head -n 1
          python3 --version
          dpkg -s libc6 | grep -E '^(Package|Version):'
          uname -sr

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx4-udp-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      # The reference side makes a tap device in a network namespace of
      # its own: the tun driver must be there (no package: the kernel's).
      - name: the runner's tap device
        run: |
          sudo modprobe tun
          ls -l /dev/net/tun

      - name: UDP and sockets, the plan's legs (all four in the full tier)
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx4-udp $PAX_LEGS

      - name: keep the programs' sums, the Linux side, the transcripts, the captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx4-udp-linux
          path: |
            build/mpx4-udp/net/sums.txt
            build/mpx4-udp/net.txt
            build/mpx4-udp/linux/
            build/mpx4-udp/linux.txt
            build/mpx4-udp/*.run
            build/mpx4-udp/*.initramfs.txt
            build/mpx4-udp/*/kmain_sockets.elf
            build/mpx4-udp/*/*.log
            build/mpx4-udp-*.out/
            build/mpx4-udp-*.log
            build/mpx4-udp-*.norm
            build/mpx4-udp-*.meta
            build/mpx4-udp-*.halt
            build/mpx4-udp-*.verdict
            build/mpx4-udp-*.end
            build/mpx4-udp-*.pcap
            build/mpx4-udp-*.check
            build/mpx4-udp-gateway-probe.txt
            build/mpx4-udp-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px23: TCP. Ten static Linux programs (user/net: eight C files built
  # here by tools/mknet against this runner's glibc, and two wolf
  # programs built by the pinned wolf) run unmodified on
  # kernel/kmain_sockets from the initramfs: what AF_INET stream
  # sockets answer with nothing on the wire, a forking server and its
  # client over loopback, a wolf program serving itself, an echo
  # server (plain and a child a connection), a client, a 16 MiB
  # transfer each way and over loopback, 10,000 connections each way
  # and over loopback, a listen queue nobody empties, how a connection
  # ends, the scripted single faults each way, the malformed and the
  # stray, the loss matrix, a wolf program serving another machine.
  # tests/mpx4-tcp, both tiers, BIOS and UEFI, three ways: against
  # tools/net-peer --tcp on a socket netdev (the whole network, with a
  # TCP of its own and the faults; every frame held to its bytes),
  # against QEMU's user-mode network and its TCP with tools/tcp-host at
  # this runner's end, and with no device at all. The reference side is
  # the same binaries on this runner's Linux in a network namespace
  # addressed as PAX is, the same net-peer script on a tap device (sudo,
  # tools/linux-net --tcp), under strace. The build and the Linux side
  # (T0); the stack up and the kernel's own echo over loopback (T1);
  # every program's output and exit status byte-identical to Linux's
  # (T2); every frame, descriptor and control block back after each
  # command (T3); -ENOSYS, refusals and the one SIGPIPE as named (T4);
  # the other end's verdict (T5); the capture rebuilt byte by byte,
  # every segment held to its connection, and the kernel's counters
  # against it (T6); the counters (T7); the transfers, the soaks and
  # the loss matrix (T8); the halt (T9). A boot is stopped 20 s after
  # its other end says FAIL, the moment a finished command is seen to
  # have printed other than Linux did, and when its serial log has not
  # grown for 300 s; and no boot is started after one that failed: a
  # broken kernel is red here in minutes.
  mpx4-tcp:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx4-tcp')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils, gcc, strace (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils gcc libc6-dev strace
          qemu-system-x86_64 --version
          clang --version
          gcc --version | head -n 1
          python3 --version
          dpkg -s libc6 | grep -E '^(Package|Version):'
          uname -sr

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx4-tcp-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      # The reference side makes a tap device in a network namespace of
      # its own: the tun driver must be there (no package: the kernel's).
      - name: the runner's tap device
        run: |
          sudo modprobe tun
          ls -l /dev/net/tun

