  # tools/mkboreutils; px15: no busybox; px26: bu20's, and sh05's pelt
  # with its second thread): a fork, execve, wait4, and px26's sessions:
  # the long listing, a `trap`, Ctrl-C at the prompt and on a child.
  # Each session (user/console/shell*.keys) is typed into PAX by
  # tools/qemu-halt --type and into the same binaries on this runner's
  # Linux by tools/linux-tty, chrooted in the same tree, pelt pid 1 of a
  # fresh pid namespace (sudo: chroot, mounts, unshare). procs
  # (user/elf/procs.c, tools/mkuser), the process calls' witness, runs as
  # pid 1 on both. tests/mpx3-shell: the build (S0), the processes and
  # every frame back (S1), every transcript byte-identical to Linux's and
  # the same exit status (S2), every typed byte arrived (S3), -ENOSYS and
  # refusals as named (S4), init's end and the halt (S5); both tiers,
  # BIOS and UEFI.
  mpx3-shell:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx3-shell')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils, gcc (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils gcc libc6-dev
          qemu-system-x86_64 --version
          clang --version
