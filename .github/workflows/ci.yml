    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils, gcc (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils gcc libc6-dev
          qemu-system-x86_64 --version
          clang --version
          gcc --version | head -n 1
          python3 --version
          dpkg -s libc6 | grep -E '^(Package|Version):'
          uname -sr

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx3-threads-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: threads, futexes and signals against Linux, and the soak; the plan's legs (all four in the all tier)
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx3-threads $PAX_LEGS

      - name: the same suite with / on a disk, native BIOS (px67, tools/rootdisk-leg; every tier it runs in)
        env:
          PAX_REQUIRE_UEFI: "1"
          PAX_ENGINE: docker
        run: |
          docker pull docker.io/library/ubuntu@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
          tools/e2fs --version
          tools/disktools --version
          tools/rootdisk-leg mpx3-threads --tier native --firmware bios

      - name: keep the program's sum, the Linux side, the outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx3-threads-linux
          path: |
            build/mpx3-threads/probes.txt
            build/mpx3-threads/linux/
            build/mpx3-threads/*.initramfs.txt
            build/mpx3-threads/*/kmain_console.elf
            build/mpx3-threads/*/*.log
            build/mpx3-threads-*.session
            build/mpx3-threads-*.session.linux
            build/mpx3-threads-*.log
            build/mpx3-threads-*.norm
            build/mpx3-threads-*.meta
            build/mpx3-threads-*.halt
            build/mpx3-threads-*.verdict
            build/mpx3-threads-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px27: the writable file tree. user/elf/tree.c (tools/mkprobes) is
  # the first program on kmain_console and, the same file, pid 1 on
  # Linux with its root a tmpfs; and a session is typed into pelt with
  # boreutils' mkdir, rmdir, rm, mv and cp at user/boreutils.pin (bu21).
  # The programs under test remove files, and one session types `rm -rf
  # /`: nothing under test runs on this runner itself. The Linux side of
  # every session is tools/linux-tree, a throwaway container (docker,
  # no network, nothing of the runner mounted but a staging directory
  # under build/). tests/mpx3-tree: the build (T0), the outputs
  # byte-identical to Linux's (T1), what PAX refuses by name, counted
  # (T2), -ENOSYS and deaths as named (T3), every frame and inode back
  # (T4), the soak — 10,000 rounds of create, write, rename, unlink —
  # with the kernel's books flat and the fill to ENOSPC and back (T5),
  # Linux's root intact after `rm -rf /` (T6), 16 MiB written and read
  # (T7), the end (T8); both tiers, BIOS and UEFI. The suite stops at
  # the first failing probes boot, each boot has a 300 s deadline, and
  # the job ends at 60 minutes: a kernel that hangs here fails fast.
  mpx3-tree:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx3-tree')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils, gcc (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils gcc libc6-dev
          qemu-system-x86_64 --version
          clang --version
          gcc --version | head -n 1
          python3 --version
          dpkg -s libc6 | grep -E '^(Package|Version):'
          uname -sr
          docker --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx3-tree-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      # The image only carries python3, mount and the coreutils that
      # tools/linux-tty and tools/linux-tree's script need inside the
      # container; it is taken by digest (python 3.12-slim as of
      # 2026-10-11), so the Linux side does not move under the suite.
      - name: the image the Linux side's containers are made from (by digest)
        run: |
          docker pull "$PAX_TREE_IMAGE"
          docker image inspect --format '{{.Id}} {{.RepoDigests}}' "$PAX_TREE_IMAGE"
        env:
          PAX_TREE_IMAGE: docker.io/library/python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1

      - name: the writable tree against Linux's tmpfs, the typed session, the soak and the fill; the plan's legs (all four in the all tier)
        env:
          PAX_REQUIRE_UEFI: "1"
          PAX_ENGINE: docker
          PAX_TREE_IMAGE: docker.io/library/python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
        run: tests/mpx3-tree $PAX_LEGS

      - name: keep the programs' sums, the Linux side, the outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx3-tree-linux
          path: |
            build/mpx3-tree/probes.txt
            build/mpx3-tree/bore/sums.txt
            build/mpx3-tree/peltbin/sums.txt
            build/mpx3-tree/linux/
            build/mpx3-tree/*.initramfs.txt
            build/mpx3-tree/*/kmain_console.elf
            build/mpx3-tree/*/*.log
            build/mpx3-tree-*.session
            build/mpx3-tree-*.session.linux
            build/mpx3-tree-*.log
            build/mpx3-tree-*.norm
            build/mpx3-tree-*.meta
            build/mpx3-tree-*.halt
            build/mpx3-tree-*.verdict
            build/mpx3-tree-*.typed
            build/mpx3-tree-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px62: mappings, FIFOs and locks (pax#127, #128, #108). Two static
  # glibc probes (user/elf/maps.c, fifos.c; tools/mkmaps) as pid 1 on PAX
  # and in a throwaway container on Linux, root and 1000:1000:
  # tests/mpx3-maps: the build (T0), the outputs byte-identical (T1),
  # PAX's named answers (T2), -ENOSYS and refusals (T3), every frame
  # back (T4), the mremap census (T5), the end (T6).
  mpx3-maps:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx3-maps')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils, gcc (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils gcc libc6-dev
          qemu-system-x86_64 --version
          clang --version
          gcc --version | head -n 1
          python3 --version
          dpkg -s libc6 | grep -E '^(Package|Version):'
          uname -sr
          docker --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx3-maps-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: the image the Linux side's containers are made from (by digest)
        run: |
          docker pull "$PAX_TREE_IMAGE"
          docker image inspect --format '{{.Id}} {{.RepoDigests}}' "$PAX_TREE_IMAGE"
        env:
          PAX_TREE_IMAGE: docker.io/library/python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1

      - name: mremap, file and shared mappings, FIFOs and flock against Linux, root and a user; the plan's legs (all four in the all tier)
        env:
          PAX_REQUIRE_UEFI: "1"
          PAX_ENGINE: docker
          PAX_TREE_IMAGE: docker.io/library/python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
        run: tests/mpx3-maps $PAX_LEGS

      - name: the same suite with / on a disk, native BIOS (px67, tools/rootdisk-leg; every tier it runs in)
        env:
          PAX_REQUIRE_UEFI: "1"
          PAX_ENGINE: docker
          PAX_TREE_IMAGE: docker.io/library/python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
        run: |
          docker pull docker.io/library/ubuntu@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
          tools/e2fs --version
          tools/disktools --version
          tools/rootdisk-leg mpx3-maps --tier native --firmware bios

      - name: keep the programs' sums, the Linux side, the outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx3-maps-linux
          path: |
            build/mpx3-maps/probes.txt
            build/mpx3-maps/bore/sums.txt
            build/mpx3-maps/linux/
            build/mpx3-maps/*.initramfs.txt
            build/mpx3-maps/*/kmain_console.elf
            build/mpx3-maps/*/*.log
            build/mpx3-maps-*.session
            build/mpx3-maps-*.session.linux
            build/mpx3-maps-*.log
            build/mpx3-maps-*.norm
            build/mpx3-maps-*.meta
            build/mpx3-maps-*.halt
            build/mpx3-maps-*.verdict
            build/mpx3-maps-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px18: the speaker. pelt as pid 1 runs /bin/play (user/play, wolf),
  # which sounds note files through the console's KIOCSOUND; the kernel
  # drives the 8254's channel 2 and port 0x61 (kernel/speaker). QEMU's
  # speaker goes to its `wav` backend. tests/mpx3-speaker: the build
  # (K0), the session against its expect file (K1), the scale's eight
  # frequencies within 1% and the kernel's timeline at the tick (K2),
  # hold's tone stopped at its end (K3), the summary (K4), the end (K5),
  # the two tunes against their files (K6, native BIOS), and Ubuntu's
  # beep through /dev/tty0 and /dev/console (K7, px21a: tools/mkbeep
  # builds it static from its source package, by digest).
  mpx3-speaker:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx3-speaker')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils, gcc, strace (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils gcc libc6-dev make strace
          strace -V | head -n 1
          qemu-system-x86_64 --version
          qemu-system-x86_64 -audiodev help
          clang --version
          gcc --version | head -n 1
          python3 --version
          uname -sr

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx3-speaker-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: the speaker plays, the plan's legs (all four in the all tier)
        env:
          PAX_REQUIRE_UEFI: "1"
          PAX_REQUIRE_STRACE: "1" # px41: K9, play's sleeps
        run: tests/mpx3-speaker $PAX_LEGS

      - name: keep the programs' sums, the captures' tones, the timelines, the transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx3-speaker-linux
          path: |
            build/mpx3-speaker/peltbin/sums.txt
            build/mpx3-speaker/playbin/sums.txt
            build/mpx3-speaker/beepbin/sums.txt
            build/mpx3-speaker/user.txt
            build/mpx3-speaker/initramfs.txt
            build/mpx3-speaker/*/kmain_console.elf
            build/mpx3-speaker/*/*.log
            build/mpx3-speaker-*.session
            build/mpx3-speaker-*.log
            build/mpx3-speaker-*.norm
            build/mpx3-speaker-*.tones
            build/mpx3-speaker-*.timeline
            build/mpx3-speaker-*.cmd*
            build/mpx3-speaker-*.meta
            build/mpx3-speaker-*.halt
            build/mpx3-speaker-*.verdict
            build/mpx3-speaker-*.typed
            build/mpx3-speaker-*.wav
            build/mpx3-speaker-runs.txt
            build/mpx3-speaker-play.strace
          retention-days: 14
          if-no-files-found: warn

  # px30: sampled sound. QEMU's virtio sound device under kmain_console,
  # its output to the `wav` backend at 48 kHz; unmodified static Linux
  # programs (user/sound: dsptone, dspprobe) and /bin/play's mixed mode
  # through OSS's /dev/dsp. tests/mpx3-sound: the device (S1), the
  # witnesses' answers and a two-channel tone (S2), a ramp exact frame
  # for frame (S3), an underrun (S4), a process ended mid-sound (S5),
  # O_NONBLOCK (S6), play mixed (S7).
  mpx3-sound:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx3-sound')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils, gcc (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils gcc libc6-dev make
          qemu-system-x86_64 --version
          qemu-system-x86_64 -audiodev help
          qemu-system-x86_64 -device help | grep -i -E 'virtio-sound|AC97|hda'
          clang --version
          gcc --version | head -n 1
          python3 --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx3-sound-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: the sound device plays, the plan's legs (all four in the all tier)
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx3-sound $PAX_LEGS

      - name: keep the programs, the captures' verdicts, the transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx3-sound-linux
          path: |
            build/mpx3-sound/sound.txt
            build/mpx3-sound/play.txt
            build/mpx3-sound/*/kmain_console.elf
            build/mpx3-sound/*/*.log
            build/mpx3-sound-*.log
            build/mpx3-sound-*.norm
            build/mpx3-sound-*.txt
            build/mpx3-sound-*.verdict
            build/mpx3-sound-*.spec
            build/mpx3-sound-*.wav
            build/mpx3-sound-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px32: play's part format, the orchestra. tests/mpx3-orchestra: the
  # refusals (O1), the old formats unchanged (O2), the written lengths
  # (O3), the frames judged on the runner itself (O4: each part's onsets,
  # presence, pp < ff, tremolo, the struck instruments; the study, 16+
  # voices), then QEMU's virtio sound under kmain_console: the captures
  # judged by the same specs (O5) and the cost in the guest (O6).
  mpx3-orchestra:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx3-orchestra')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils, gcc (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils gcc libc6-dev make
          qemu-system-x86_64 --version
          python3 --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx3-orchestra-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: the orchestra, on the runner and under QEMU, the plan's legs (all four in the all tier)
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx3-orchestra $PAX_LEGS

      - name: keep the verdicts, the transcripts and the captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx3-orchestra-linux
          path: |
            build/mpx3-orchestra/play.txt
            build/mpx3-orchestra/*.verdict
            build/mpx3-orchestra/*.played
            build/mpx3-orchestra/old-cost.txt
            build/mpx3-orchestra-*.log
            build/mpx3-orchestra-*.norm
            build/mpx3-orchestra-*.txt
            build/mpx3-orchestra-*.verdict
            build/mpx3-orchestra-*.wav
          retention-days: 14
          if-no-files-found: warn

  # px08: the tour of the kernel. kmain_tour and kmain_tour_text
  # (kernel/pax_tour's stages over the test kernels' paths), two ISOs behind
  # Limine's menu (tools/tour build), both tiers, BIOS and UEFI.
  # tests/tour: the build (R0), the stages in order (R1), the frame round
  # trip (R2), W^X read back from the live tables (R3), four named threads
  # interleaved and joined (R4), ending (a) a stack overflow and (b) a
  # write to text, each panicking by name and halted (R5, R6), the pauses
  # (R7).
  tour:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'tour')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version
          python3 --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: tour-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: the tour, the plan's legs (all four in the all tier)
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/tour $PAX_LEGS

      - name: keep the ISOs, the transcripts, the timings, the halt probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-tour-linux
          path: |
            build/tour/
            build/tour-*.log
            build/tour-*.norm
            build/tour-*.times
            build/tour-*.meta
            build/tour-*.halt
            build/tour-*.verdict
            build/tour-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px20, px21: the network, toward M-PX4. kernel/kmain_net finds
  # QEMU's virtio network device on the PCI bus (kernel/pci), drives it
  # through the virtio 1.x interface (kernel/virtio, kernel/net),
  # resolves addresses through an ARP cache (kernel/arp), speaks IPv4
  # (kernel/ip) and answers and sends ICMP echo (kernel/icmp).
  # tests/mpx4-net, both tiers, BIOS and UEFI: what this runner's QEMU
  # gateway answers (G0, tools/gateway-probe); against the user-mode
  # gateway, a transitional and a 1.x-only device — the census (N1),
  # the device up (N2), a request answered (N3), the gateway in the
  # cache (N4), six pings (N12), 10000 echoes with the books flat (N6),
  # 25000 frames in two bursts (N7); against tools/net-peer on a socket
  # netdev — the pending queue, the route, the retry, the ageing, echo
  # requests into PAX answered byte for byte, the malformed dropped by
  # name, destination unreachable, 10000 echoes (P1-P4); for all three,
  # QEMU's filter-dump capture rebuilt byte by byte with every checksum
  # recomputed (N5), the kernel's counters against it (N8) and the halt
  # (N9); no device (N10) and a legacy-only device (N11), each one
  # named line and no panic. Since px22 a UDP datagram for a port no
  # socket holds draws a port unreachable (this kernel makes no
  # socket); the sockets themselves are the mpx4-udp job's.
  mpx4-net:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx4-net')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version
          python3 --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx4-net-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      # What this runner lets an unprivileged process do with ICMP: the
      # user-mode gateway can answer for an outside address only where
      # this range admits the runner's group (printed, not held).
      - name: the runner's ICMP policy
        run: cat /proc/sys/net/ipv4/ping_group_range

      - name: the network, the plan's legs (all four in the all tier)
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx4-net $PAX_LEGS

      - name: keep the kernels, the transcripts, the captures and the halt probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx4-net-linux
          path: |
            build/mpx4-net/*/*.elf
            build/mpx4-net/*/*.iso
            build/mpx4-net/*/*.log
            build/mpx4-net-*.log
            build/mpx4-net-*.meta
            build/mpx4-net-*.halt
            build/mpx4-net-*.verdict
            build/mpx4-net-*.expect
            build/mpx4-net-*.pcap
