# pax — CI.
#
# The harness proof on every push to trunk and every pull request:
# build the assembly stub, wrap it in the Limine ISO, boot it under
# SeaBIOS and OVMF, assert the serial log and QEMU's exit status, and
# stop it under gdb at _start. Then a macOS job boots the SAME ISO with
# Homebrew's QEMU, so the harness's macOS claim is measured, not stated.
#
# The `mkw` job is M-KW (kw05): the first wolf kernel, built by the wolf
# kernel/wolf.pin names, booted the same way. The pin is the wolf
# release archive, fetched and checked by digest on every run, never
# cached and never built (px05: 0.2.23; px02 and kw10 built wolf-lang
# from source, and cached the build, while no release carried kw06-kw09).
#
# QEMU, OVMF, xorriso and gdb come from the distro (apt) and Homebrew;
# Limine comes from its release archive BY DIGEST (tools/fetch-limine
# refuses on a mismatch). Every step runs bare and its exit code is read
# directly: no pipes, so nothing masks a failure.

name: ci

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, gdb (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso gdb
          qemu-system-x86_64 --version
          xorriso -version 2>&1 | head -n 1
          ls -l /usr/share/OVMF/

      - uses: actions/cache@v4
        with:
          path: .pax-cache
          key: limine-${{ hashFiles('boot/limine.pin') }}

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: expect-serial can say no
        run: tests/expect-serial-selftest

      - name: the proof, BIOS and UEFI
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/proof

      - name: the proof's ISO, by digest
        run: |
          sha256sum build/pax-stub.iso > build/pax-stub.iso.sha256
          cat build/pax-stub.iso.sha256

      - name: gdb stops at _start (BIOS)
        run: tests/gdb-attach --firmware bios

      - name: gdb stops at _start (UEFI)
        run: tests/gdb-attach --firmware uefi

      - name: keep the image and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-proof-linux
          path: |
            build/pax-stub.iso
            build/pax-stub.iso.sha256
            build/stub/pax-stub.elf
            build/*.log
            build/*.meta
            build/*.out
          retention-days: 14
          if-no-files-found: warn

  macos-run:
    needs: proof
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pax-proof-linux
          path: build

      - name: the very ISO the linux proof booted
        run: shasum -a 256 -c build/pax-stub.iso.sha256

      - name: qemu (Homebrew)
        run: |
          brew install qemu
          qemu-system-x86_64 --version

      - name: the proof on the linux-built ISO, BIOS and UEFI
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/proof --image build/pax-stub.iso

  # M-KW (kw05, kw00 §3e): a freestanding wolf kernel, built by the wolf
  # kernel/wolf.pin names on both tiers, linked with the Limine boot
  # path, booted under SeaBIOS and OVMF: serial ends `KWC`, status 33;
  # the trap kernel ends `TRAP 1`, status 3; the machines' refusals as
  # recorded; and the seen-red variants (no --target; KWD) refused in the
  # same run. Every step bare, exit codes read directly.
  mkw:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
            .pax-cache/lupin-*
          key: mkw-${{ hashFiles('boot/limine.pin', 'kernel/wolf.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: lupin at the pin (by digest)
        run: |
          bin=$(tools/fetch-lupin)
          echo "PAX_LUPIN=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: expect-serial can say no (incl. --tail)
        run: tests/expect-serial-selftest

      - name: M-KW, both tiers, BIOS and UEFI
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mkw

      - name: keep the kernels and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mkw-linux
          path: |
            build/mkw/
            build/mkw-*.log
            build/mkw-*.meta
            build/mkw-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # M-PX1 (px01): first light. The wolf kernel (kernel/), built by the
  # pinned wolf on both tiers, booted under SeaBIOS and OVMF:
  # its transcript (A2), its halt proven through QEMU's monitor (A3), the
  # panic kernel's `PANIC <kind> <file>:<line>` and halt (A4, A5), and a
  # spinning kernel refused by the halt probe in the same run (A6).
  mpx1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx1-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: expect-serial can say no (incl. --tail, --regex)
        run: tests/expect-serial-selftest

      - name: M-PX1, both tiers, BIOS and UEFI
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx1

      - name: keep the kernels, the transcripts and the halt probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx1-linux
          path: |
            build/mpx1/
            build/mpx1-*.log
            build/mpx1-*.meta
            build/mpx1-*.halt
            build/mpx1-*.verdict
            build/mpx1-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px04: the syscall census's own tools. tests/census proves tally.py's
  # attribution on a hand-written strace fixture (C1), that the committed
  # union, milestone tables and docs/CENSUS.md are exactly what the
  # committed tallies generate (C2), and that every census call has a
  # number and a P3 lane (C3). No tracing here: the traces run in
  # containers on kasumi (tools/census/census).
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: python
        run: python3 --version

      - name: the census tools, C1-C3
        run: tests/census

  # px02: physical frames. kernel/frames, built from Limine's memory map
  # by the pinned wolf on both tiers, booted under SeaBIOS and OVMF: the
  # totals against the map (F2), every frame handed out exactly once,
  # aligned, usable, above 1 MiB, outside the image and the allocator's
  # state (F3), written and read back through the HHDM (F4), freed and
  # handed out again (F5), and a double free and a free of a frame never
  # usable each panicking by name (F6, F7), every halt proven (F8).
  mpx2-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx2-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: physical frames, both tiers, BIOS and UEFI
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx2-frames

      - name: keep the kernels, the transcripts and the halt probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx2-frames-linux
          path: |
            build/mpx2/
            build/mpx2-*.log
            build/mpx2-*.meta
            build/mpx2-*.halt
            build/mpx2-*.verdict
            build/mpx2-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px03: paging. kernel/paging builds PAX's own four-level structures
  # from px02's frames and switches CR3 to them; tests/mpx2-paging reads
  # them back through QEMU's monitor on the halted machine (`info
  # registers`, `info tlb`, `xp /256gx $cr3`): the switch (G2), the
  # image's W^X per section (G3), the HHDM kept and nothing in the lower
  # half (G4), a map/unmap round trip (G6), the halt (G8). G7, the write
  # to text, moved to mpx2-interrupts I1 at kw10 (it now panics by name). px02's frame exercise on the new structures is the
  # mpx2-frames job's (G5).
  mpx2-paging:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version
          readelf --version | head -n 1

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx2-paging-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: paging, both tiers, BIOS and UEFI
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx2-paging

      - name: keep the kernels, the transcripts, the monitor's answers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx2-paging-linux
          path: |
            build/mpx2-paging/
            build/mpx2-paging-*.log
            build/mpx2-paging-*.meta
            build/mpx2-paging-*.halt
            build/mpx2-paging-*.fault
            build/mpx2-paging-*.verdict
            build/mpx2-paging-*.regs
            build/mpx2-paging-*.cmd*
            build/mpx2-paging-*.int
            build/mpx2-paging-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # kw10: interrupts. The kernel's own GDT, TSS (IST1) and IDT; all 32
  # exceptions and the 8259's 16 lines through boot/isr.S's trampolines
  # to wolf (kernel/gdt, kernel/idt, kernel/interrupts); the timer
  # (kernel/apic, kernel/timer). tests/mpx2-interrupts: the trampolines'
  # shapes in the ELF (I0), a write to text panicking `page fault` with
  # CR2 (I1), `ud2` panicking `invalid opcode` (I2), `int3` returning
  # (I3), a double fault on IST1 (I4), 20 PIT ticks on vector 32 (I5),
  # the descriptor-table registers read back from the halted machine
  # (I6).
  mpx2-interrupts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version
          objdump --version | head -n 1

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx2-interrupts-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: interrupts, both tiers, BIOS and UEFI
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx2-interrupts

      - name: keep the kernels, the transcripts, the monitor's answers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx2-interrupts-linux
          path: |
            build/mpx2-interrupts/
            build/mpx2-interrupts-*.log
            build/mpx2-interrupts-*.meta
            build/mpx2-interrupts-*.halt
            build/mpx2-interrupts-*.verdict
            build/mpx2-interrupts-*.cmd*
            build/mpx2-interrupts-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px07: the scheduler. Kernel threads on one CPU, switched by the timer
  # (boot/isr.S's trampoline resumes the frame pax_interrupt returns),
  # each on a stack from frames with an unmapped guard (kernel/sched),
  # a spinlock on wolf's atomics (kernel/sync). tests/mpx2-sched: the
  # trampoline's shape (S0), three threads alternating by preemption
  # alone (S1), sleep waking on the tick (S2), exit reclaiming the stack
  # (S3), a locked counter exact where the unlocked control loses
  # updates (S4), a stack overflow into the guard panicking by name
  # (S5), the halt (S6).
  mpx2-sched:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version
          objdump --version | head -n 1

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx2-sched-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: the scheduler, both tiers, BIOS and UEFI
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx2-sched

      - name: keep the kernels, the transcripts, the halt probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx2-sched-linux
          path: |
            build/mpx2-sched/
            build/mpx2-sched-*.log
            build/mpx2-sched-*.norm
            build/mpx2-sched-*.meta
            build/mpx2-sched-*.halt
            build/mpx2-sched-*.verdict
            build/mpx2-sched-runs.txt
          retention-days: 14
          if-no-files-found: warn
