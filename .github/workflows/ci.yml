  # px09: user mode (M-PX3's first step). Programs in ring 3, each in an
  # address space of its own (the user half private, the kernel half
  # shared), calling the kernel through `syscall` with Linux's x86-64
  # numbers (write 1, exit 60; anything else -ENOSYS) and returning by
  # `sysretq`; a fault in ring 3 kills the program by name and the kernel
  # goes on (kernel/user, boot/user.S, user/programs.S). tests/mpx3-user:
  # the trampolines' shapes (U0), STAR/LSTAR/FMASK, SMEP and SMAP (U1),
  # hello (U2), five faults killed by name (U3), write's bad pointers
  # -EFAULT (U4), two processes at once preempted in ring 3 (U5), a
  # program after them all and every frame given back (U6), the kernel
  # refused a user byte without STAC (U7) and a jump into a user page
  # (U8).
  mpx3-user:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx3-user')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version
          objdump --version | head -n 1

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx3-user-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: user mode, the plan's legs (all four in the full tier)
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx3-user $PAX_LEGS

      - name: keep the kernels, the transcripts, the halt probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx3-user-linux
          path: |
            build/mpx3-user/
            build/mpx3-user-*.log
            build/mpx3-user-*.norm
            build/mpx3-user-*.meta
            build/mpx3-user-*.halt
            build/mpx3-user-*.verdict
            build/mpx3-user-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px10: the ELF loader and the initramfs (M-PX3's next step). The
  # programs are user/elf/hello.S built here with the runner's gcc and
  # binutils (no libc), packed by tools/mkinitramfs, handed to
  # kmain_loader as a Limine module; hello's output on PAX is compared
  # byte for byte with its output on this runner's own Linux. tests/
  # mpx3-loader: the build (L0), the initramfs (L1), hello against Linux
  # (L2), the segments (L3), six refusals by name (L4), the FPU state per
  # thread (L5), the frames (L6), the halt (L7), and a wolf program
  # linked static against the runner's glibc run until PAX lacks what it
  # asks for (L8, the gap census); both tiers, BIOS and UEFI.
  mpx3-loader:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx3-loader')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
