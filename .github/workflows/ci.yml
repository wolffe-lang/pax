            build/mpx3-boreutils-*.meta
            build/mpx3-boreutils-*.halt
            build/mpx3-boreutils-*.verdict
            build/mpx3-boreutils-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px13: the console. kmain_console starts COM1's receiver and the
