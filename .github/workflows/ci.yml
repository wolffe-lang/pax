        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx2-heap $PAX_LEGS

      - name: keep the kernels, the transcripts and the halt probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx2-heap-linux
          path: |
