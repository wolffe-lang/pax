  # epoll, eventfd, and the rest of what wolf's hosted runtime and lobo
  # ask: writev, getrandom's flags, sched_getaffinity, sigaltstack,
  # socket options, two threads each waiting); an echo server on epoll
  # that holds 64 connections at once, is stormed twice (every one made
  # ready together: each answered once, none again) and then serves
  # 10,000 more; and a wolf server and client that wait through wolf's
  # runtime. tests/mpx4-ready, both tiers, BIOS and UEFI, three ways:
  # with no network device (loopback), against tools/net-peer --ready on
  # a socket netdev, and against QEMU's user-mode network with
  # tools/ready-host at this runner's end; the reference side is
  # tools/linux-net --ready on a tap device. After every command the
