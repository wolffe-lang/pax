  # (T0), the two outputs byte-identical (T1), the guard page (T2),
  # -ENOSYS, refusals and deaths as named (T3), every frame back (T4),
  # the soak — 10,000 threads made and joined, 12,000 signals delivered
  # — with the kernel's counters flat (T5), the end (T6); both tiers,
  # BIOS and UEFI. The suite stops at the first failing probes boot, and
  # the job at 45 minutes: a kernel that hangs here fails fast.
  mpx3-threads:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx3-threads')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
    runs-on: ubuntu-latest
