        env:
          PAX_REQUIRE_UEFI: "1"
          PAX_ENGINE: docker
          PAX_TREE_IMAGE: docker.io/library/python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
        run: tests/mpx4-lobo --round 30 $PAX_LEGS

      - name: the same suite with / on a disk, native BIOS (px67, tools/rootdisk-leg; the full and all tiers, a long suite)
        if: needs.plan.outputs.tier != 'pr'
        env:
          PAX_REQUIRE_UEFI: "1"
          PAX_ENGINE: docker
          PAX_TREE_IMAGE: docker.io/library/python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
        run: |
          docker pull docker.io/library/ubuntu@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
          tools/e2fs --version
          tools/disktools --version
          tools/rootdisk-leg mpx4-lobo --round 30 --tier native --firmware bios

      - name: keep the programs' sums, the sessions on both sides, the runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx4-lobo
          path: |
            build/mpx4-lobo/*.txt
            build/mpx4-lobo/lobo/sums.txt
            build/mpx4-lobo/lobo-release/sums.txt
            build/mpx4-lobo/*/kmain_session.build-kernel.log
            build/mpx4-lobo-*/steps.log
            build/mpx4-lobo-*/qemu.log
            build/mpx4-lobo-*/console.log
            build/mpx4-lobo-*/resp/
            build/mpx4-lobo-*/backend/
            build/mpx4-lobo-*/load-*.txt
            build/mpx4-lobo-*/get-*.txt
            build/mpx4-lobo-*.out
            build/mpx4-lobo-*.check
            build/mpx4-lobo-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # The run's verdict and its name: `tier all`, `tier full`, `tier pr`,
  # `tier partial` or `tier noop`. It needs every job, runs whatever they
  # did, and fails unless the plan succeeded, the tier's shape held (tl29:
  # `all` and `full` chose every suite, on their own legs), every suite
  # the plan chose succeeded, and every suite it did not choose was
  # skipped (a job that ran unasked, or one skipped although chosen, is a
  # broken wiring, not a pass). The name is what tools/lane-audit can read
  # to know a green run was the merge gate's, or every leg.
  # `!cancelled()`, not `always()`: a run superseded by a newer push must
  # end, not hold its concurrency group (and the newer run) until a
  # runner is free to judge a run nobody needs (seen on 38275354849).
  # px39: the credentials, the first lane of the users campaign. Static
  # Linux programs (tools/mkcred: px38's cred and ids, px39's ident and
  # as) are the first program on kmain_console, as root and again after
  # becoming 1000:1000, and every line they write is held to what the
  # same programs wrote under the real root of a Linux booted under QEMU
  # (tests/mpx5-users.d/linux/, recorded on kasumi: no account is made
  # anywhere, and no rootless container's root is a reference for
  # root). tests/mpx5-users: the build and the recordings (U0), the
  # outputs byte-identical (U1: cred 2,683 of 2,684 lines as root, the
  # one by ruling R4; 3,983 of 3,983 as a user), what is PAX's own by
  # name (U2), every frame back (U3), a million id calls with the free
  # memory flat (U4), the end (U5); both tiers, BIOS and UEFI. No
  # permission check exists yet: the suite holds the ids and the id
  # calls' rules, nothing more.
  mpx5-users:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx5-users')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils, gcc (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils gcc libc6-dev
          qemu-system-x86_64 --version
          clang --version
          gcc --version | head -n 1
          python3 --version
          dpkg -s libc6 | grep -E '^(Package|Version):'
          uname -sr

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx5-users-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: only soak-user gets the longer deadline; full counts remain
        run: python3 -I tests/mpx5-users.d/deadline.py

      - name: the credentials against real root's recording, as root and as a user; the plan's legs (all four in the all tier)
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx5-users $PAX_LEGS

      - name: the same suite with / on a disk, native BIOS (px67, tools/rootdisk-leg; every tier it runs in)
        env:
          PAX_REQUIRE_UEFI: "1"
          PAX_ENGINE: docker
        run: |
          docker pull docker.io/library/ubuntu@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
          tools/e2fs --version
          tools/disktools --version
          tools/rootdisk-leg mpx5-users --tier native --firmware bios

      - name: keep the programs' sums, the sessions, the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx5-users-linux
          path: |
            build/mpx5-users/programs.txt
            build/mpx5-users/*.initramfs.txt
            build/mpx5-users/*/kmain_console.elf
            build/mpx5-users/*/*.log
            build/mpx5-users-*.session
            build/mpx5-users-*.log
            build/mpx5-users-*.norm
            build/mpx5-users-*.meta
            build/mpx5-users-*.halt
            build/mpx5-users-*.verdict
            build/mpx5-users-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px46: the accounts (P5 U6). An image with root, pax and lobo, pelt
  # as pid 1, boreutils' identity tools and PAX's own su (user/su,
  # tools/mksu: wolf 0.2.35 by digest, px65); one typed session against the
  # same binaries in a throwaway container (tools/linux-tree --owners)
  # and against real root's committed recording
  # (tests/mpx5-accounts.d/linux/).
  mpx5-accounts:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx5-accounts')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils, gcc (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils gcc libc6-dev
          qemu-system-x86_64 --version
          clang --version
          gcc --version | head -n 1
          python3 --version
          dpkg -s libc6 | grep -E '^(Package|Version):'
          uname -sr
          docker --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx5-accounts-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: the image the Linux side's container is made from (by digest)
        run: |
          docker pull "$PAX_TREE_IMAGE"
          docker image inspect --format '{{.Id}} {{.RepoDigests}}' "$PAX_TREE_IMAGE"
        env:
          PAX_TREE_IMAGE: docker.io/library/python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1

      - name: the accounts' typed session against the container and real root's recording; the plan's legs (all four in the all tier)
        env:
          PAX_REQUIRE_UEFI: "1"
          PAX_ENGINE: docker
          PAX_TREE_IMAGE: docker.io/library/python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
        run: tests/mpx5-accounts $PAX_LEGS

      - name: keep the programs' sums, the Linux side, the sessions, the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx5-accounts-linux
          path: |
            build/mpx5-accounts/initramfs.txt
            build/mpx5-accounts/bore/sums.txt
            build/mpx5-accounts/peltbin/sums.txt
            build/mpx5-accounts/subin/sums.txt
            build/mpx5-accounts/linux/
            build/mpx5-accounts/recording.cmp
            build/mpx5-accounts/*/kmain_console.elf
            build/mpx5-accounts/*/*.log
            build/mpx5-accounts-*.session
            build/mpx5-accounts-*.cmp
            build/mpx5-accounts-*.log
            build/mpx5-accounts-*.norm
            build/mpx5-accounts-*.meta
            build/mpx5-accounts-*.halt
            build/mpx5-accounts-*.verdict
            build/mpx5-accounts-*.typed
            build/mpx5-accounts-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px48: job control. Process groups, sessions, the console as a
  # controlling terminal, stops and continues, the foreground group's
  # keys, the background rules, hangup and the orphaned group: px48's
  # probe (user/elf/jobs.c, tools/mkjobs) and a typed job-control session
  # in Ubuntu 24.04's static busybox (tools/fetch-busybox, by digest), as
  # root and as a user, against real root's committed recordings
  # (tests/mpx5-jobs.d/linux/) and, for the user's, a throwaway container
  # (tools/linux-tree). px51: pelt's own job control (sh18's sessions,
  # tools/mkpelt) and boreutils' kill and timeout (tools/mkboreutils),
  # typed at pelt, against the same recordings and container. px53:
  # bu28's timeout rows in that session, and sigwolf (user/sigwolf,
  # tools/mksigwolf: wolf 0.2.35 by digest, px65), a probe of 0.2.33's five
  # signal calls, against the same.
  mpx5-jobs:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx5-jobs')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils, gcc, zstd (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils gcc libc6-dev zstd curl
          qemu-system-x86_64 --version
          gcc --version | head -n 1
          python3 --version
          dpkg -s libc6 | grep -E '^(Package|Version):'
          uname -sr
          docker --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx5-jobs-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: the image the Linux side's container is made from (by digest)
        run: |
          docker pull "$PAX_TREE_IMAGE"
          docker image inspect --format '{{.Id}} {{.RepoDigests}}' "$PAX_TREE_IMAGE"
        env:
          PAX_TREE_IMAGE: docker.io/library/python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1

      - name: job control against real root's recordings and the container, as root and as a user; the plan's legs (all four in the all tier)
        env:
          PAX_REQUIRE_UEFI: "1"
          # px52 (pax#85): a dispatch's `jobs_boots` (empty on every other
          # event: every boot), so a plant's red at a later image is seen
          # here and not hidden behind the probe's.
          PAX_JOBS_BOOTS: ${{ inputs.jobs_boots }}
          PAX_ENGINE: docker
          PAX_TREE_IMAGE: docker.io/library/python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
        run: tests/mpx5-jobs $PAX_LEGS

      - name: the same suite with / on a disk, native BIOS (px67, tools/rootdisk-leg; the full and all tiers, a long suite)
        if: needs.plan.outputs.tier != 'pr'
        env:
          PAX_REQUIRE_UEFI: "1"
          # px52 (pax#85): a dispatch's `jobs_boots` (empty on every other
          # event: every boot), so a plant's red at a later image is seen
          # here and not hidden behind the probe's.
          PAX_JOBS_BOOTS: ${{ inputs.jobs_boots }}
          PAX_ENGINE: docker
          PAX_TREE_IMAGE: docker.io/library/python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
        run: |
          docker pull docker.io/library/ubuntu@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
          tools/e2fs --version
          tools/disktools --version
          tools/rootdisk-leg mpx5-jobs --tier native --firmware bios

      - name: keep the programs' sums, the Linux side, the sessions, the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx5-jobs-linux
          path: |
            build/mpx5-jobs/*.txt
            build/mpx5-jobs/pelt/sums.txt
            build/mpx5-jobs/bore/sums.txt
            build/mpx5-jobs/sigwolf/sums.txt
            build/mpx5-jobs/edwolf/sums.txt
            build/mpx5-jobs/linux/
            build/mpx5-jobs/rec-*.cmp
            build/mpx5-jobs/*/kmain_console.elf
            build/mpx5-jobs/*/*.log
            build/mpx5-jobs-*.session
            build/mpx5-jobs-*.cmp
            build/mpx5-jobs-*.log
            build/mpx5-jobs-*.norm
            build/mpx5-jobs-*.meta
            build/mpx5-jobs-*.halt
            build/mpx5-jobs-*.verdict
            build/mpx5-jobs-*.typed
            build/mpx5-jobs-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px54 (ruling #91 R4): lope (user/lope.pin, tools/mklope), the
  # directory jumper in wolf, preinstalled on PAX, and its no-prefix jump
  # at the console through pelt's command_not_found_handle (sh21,
  # user/pelt.pin): a typed session as root and as a user against the
  # same binaries in a throwaway container (tools/linux-tree). lope is
  # PRIVATE and this repository public, so lope is checked out with the
  # org's WOLF_CI_TOKEN, as lobo checks out its private siblings: an
  # absent or refused token is a red job with git's reason, never a
  # skip. Nothing of lope's is uploaded but its sums (no binary, no
  # image, no archive).
  mpx5-lope:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx5-lope')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils, gcc (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils gcc libc6-dev curl
          qemu-system-x86_64 --version
          gcc --version | head -n 1
          python3 --version
          dpkg -s libc6 | grep -E '^(Package|Version):'
          uname -sr
          docker --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx5-lope-${{ hashFiles('boot/limine.pin') }}

      - name: lope's pin
        id: lope
        run: |
          . user/lope.pin
          echo "lope $LOPE_REV ($LOPE_REPO)"
          echo "rev=$LOPE_REV" >> "$GITHUB_OUTPUT"

      - name: the token lope's checkout needs (absence is failure)
        env:
          TOKEN: ${{ secrets.WOLF_CI_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::error title=No WOLF_CI_TOKEN for lope::wolffe-lang/lope is private and this repository public, so this job checks lope out with the org's WOLF_CI_TOKEN, which this run does not have. A red job on purpose: a skip would leave lope's gate unrun under a green mark (lobo's acquire-toolchain lesson). Grant pax the secret with read access to wolffe-lang/lope, or make lope public and fetch it as pelt is fetched."
            exit 1
          fi
          echo "WOLF_CI_TOKEN present"

      - name: lope at the pin (private; the org's WOLF_CI_TOKEN; absence is failure)
        uses: actions/checkout@v4
        with:
          repository: wolffe-lang/lope
          ref: ${{ steps.lope.outputs.rev }}
          token: ${{ secrets.WOLF_CI_TOKEN }}
          path: .lope
          persist-credentials: false

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: the image the Linux side's container is made from (by digest)
        run: |
          docker pull "$PAX_TREE_IMAGE"
          docker image inspect --format '{{.Id}} {{.RepoDigests}}' "$PAX_TREE_IMAGE"
        env:
          PAX_TREE_IMAGE: docker.io/library/python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1

      - name: lope's session against the container, as root and as a user; the plan's legs (all four in the all tier)
        env:
          PAX_REQUIRE_UEFI: "1"
          PAX_LOPE_REPO: ${{ github.workspace }}/.lope
          PAX_ENGINE: docker
          PAX_TREE_IMAGE: docker.io/library/python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
        run: tests/mpx5-lope $PAX_LEGS

      - name: keep the programs' sums, the Linux side, the sessions, the logs (no lope binary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx5-lope
          path: |
            build/mpx5-lope/*.txt
            build/mpx5-lope/lope/sums.txt
            build/mpx5-lope/pelt/sums.txt
            build/mpx5-lope/bore/sums.txt
            build/mpx5-lope/linux/
            build/mpx5-lope/*/kmain_console.elf
            build/mpx5-lope/*/*.log
            build/mpx5-lope-*.session
            build/mpx5-lope-*.cmp
            build/mpx5-lope-*.log
            build/mpx5-lope-*.norm
            build/mpx5-lope-*.meta
            build/mpx5-lope-*.halt
            build/mpx5-lope-*.verdict
            build/mpx5-lope-*.typed
            build/mpx5-lope-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px61: pelt's 22 corpus rows (one named FIFO blocker), nine sessions,
  # eleven fork shapes, nine probes and static table checks, root and pax.
  mpx5-pelt:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx5-pelt')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
      PAX_PELT_CASES: ${{ inputs.pelt_cases }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils, gcc (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils gcc libc6-dev curl zstd
          qemu-system-x86_64 --version
          gcc --version | head -n 1
          python3 --version
          dpkg -s libc6 | grep -E '^(Package|Version):'
          uname -sr
          docker --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx5-pelt-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: the image the Linux side's container is made from (by digest)
        run: |
          docker pull "$PAX_TREE_IMAGE"
          docker image inspect --format '{{.Id}} {{.RepoDigests}}' "$PAX_TREE_IMAGE"
        env:
          PAX_TREE_IMAGE: docker.io/library/python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1

      - name: pelt's complete fork replay against Linux, as root and as a user; the plan's legs (all four in the all tier)
        env:
          PAX_REQUIRE_UEFI: "1"
          PAX_ENGINE: docker
          PAX_TREE_IMAGE: docker.io/library/python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
        run: tests/mpx5-pelt $PAX_LEGS

      - name: the same suite with / on a disk, native BIOS (px67, tools/rootdisk-leg; the full and all tiers, a long suite)
        if: needs.plan.outputs.tier != 'pr'
        env:
          PAX_REQUIRE_UEFI: "1"
          PAX_ENGINE: docker
          PAX_TREE_IMAGE: docker.io/library/python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
        run: |
          docker pull docker.io/library/ubuntu@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
          tools/e2fs --version
          tools/disktools --version
          tools/rootdisk-leg mpx5-pelt --tier native --firmware bios

      - name: keep the programs' sums, the Linux side, the sessions, the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx5-pelt
          path: |
            build/mpx5-pelt/*/sums.txt
            build/mpx5-pelt/linux/
            build/mpx5-pelt/*.txt
            build/mpx5-pelt/run-names
            build/mpx5-pelt-*.log*
          retention-days: 14
          if-no-files-found: warn

  # px57 (item 2): aspen (user/aspen.pin, tools/mkaspen), tree(1) in wolf,
  # preinstalled on PAX as /bin/aspen and typed at pelt: a session as root
  # and as a user against the same binaries in a throwaway container
  # (tools/linux-tree). aspen is public: tools/mkaspen fetches it.
  mpx5-aspen:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx5-aspen')
