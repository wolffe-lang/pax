            build/mpx3-boreutils/bore.txt
            build/mpx3-boreutils/linux/
            build/mpx3-boreutils/linux.txt
            build/mpx3-boreutils/initramfs.txt
            build/mpx3-boreutils/*/kmain_boreutils.elf
