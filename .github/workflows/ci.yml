  # px12: M-PX3. Unmodified static x86-64 Linux programs on PAX:
  # boreutils (user/boreutils.pin's tree, built here by tools/mkboreutils
  # with the toolchain that tree pins, linked static against this
  # runner's glibc; px15: boreutils' own `ls`, where px12 ran
  # busybox-static's), in the initramfs with a run list kmain_boreutils runs; the same
  # binaries run on this runner's Linux, chrooted in the same tree (sudo,
