  # px26: threads, futexes and signals. user/elf/threads.c
  # (tools/mkprobes: this runner's cc and static glibc with pthreads) is
  # the first program on kmain_console and, the same file, pid 1 of a
  # fresh pid namespace on this runner's Linux; it prints what a kernel
  # decides about threads, `futex`, signal delivery, the signal frame,
  # the registers and x87/SSE/AVX state a handler's return puts back,
  # restarted and interrupted system calls, wait statuses, a thread's
