          # builds nothing, so it needs no Rust.
          if [ "${LUPIN_FROM:-tag}" = release ]; then echo "lupin from the $LUPIN_SRC_TAG release's musl archive: no Rust needed"; exit 0; fi
          rustup --version
          rustup toolchain install "$LUPIN_SRC_RUST" --profile minimal --target "$LUPIN_SRC_TARGET"
          rustup run "$LUPIN_SRC_RUST" rustc --version
          rustup target list --installed --toolchain "$LUPIN_SRC_RUST"

