  # px09: user mode (M-PX3's first step). Programs in ring 3, each in an
  # address space of its own (the user half private, the kernel half
  # shared), calling the kernel through `syscall` with Linux's x86-64
  # numbers (write 1, exit 60; anything else -ENOSYS) and returning by
  # `sysretq`; a fault in ring 3 kills the program by name and the kernel
  # goes on (kernel/user, boot/user.S, user/programs.S). tests/mpx3-user:
  # the trampolines' shapes (U0), STAR/LSTAR/FMASK, SMEP and SMAP (U1),
  # hello (U2), five faults killed by name (U3), write's bad pointers
  # -EFAULT (U4), two processes at once preempted in ring 3 (U5), a
  # program after them all and every frame given back (U6), the kernel
  # refused a user byte without STAC (U7) and a jump into a user page
  # (U8).
  mpx3-user:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx3-user')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version
          clang --version
          ld.lld --version
          objdump --version | head -n 1

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
