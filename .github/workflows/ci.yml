  # px63: the disk. kernel/vblk's virtio block device and kernel/block's
  # requests through kmain_blk's self-test: a pattern written across a
  # raw image the test makes (16 MiB and three sectors), flushed, read
  # back, and checked from the host's side; the same image read-only
  # (VIRTIO_BLK_F_RO, the write refused by name); no disk.
  mpx6-blk:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx6-blk')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils
          qemu-system-x86_64 --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx6-blk-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: the disk's self-test, the plan's legs (all four in the all tier)
        env:
          PAX_REQUIRE_UEFI: "1"
        run: tests/mpx6-blk $PAX_LEGS

      - name: keep the kernels, the transcripts and the halt probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx6-blk-linux
          path: |
            build/mpx6-blk/*/kmain_blk.elf
            build/mpx6-blk/*/*.log
            build/mpx6-blk-*.log
            build/mpx6-blk-*.meta
            build/mpx6-blk-*.verdict
            build/mpx6-blk-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px63: the file system on the disk. kernel/ext2 through kernel/tree's
  # second store, mounted by kernel/fstab: tests/mpx6-ext2's read rows (a
  # fixture image made by tools/mkdisk with e2fsprogs from a container
  # pinned by digest, mounted read-only, every line of the session Linux's,
  # the 100 MiB file through the double-indirect blocks), and, in the full
  # and all tiers, the write session (its lines Linux's, `e2fsck -fn`
  # clean, its tree Linux's by tools/e2tree) and the reboot row (a note
  # written, the machine reset by reboot(2), the note read back). The
  # Linux side is the record made on kasumi (tests/mpx6-ext2.d/linux/):
  # the runner's kernel is root's to read.
  mpx6-ext2:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx6-ext2')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
      PAX_EXT2_ROWS: ${{ needs.plan.outputs.tier == 'pr' && 'read' || 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils, gcc (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils gcc libc6-dev
          qemu-system-x86_64 --version
          gcc --version | head -n 1
          docker --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx6-ext2-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: e2fsprogs from the image pinned by digest
        run: |
          docker pull docker.io/library/ubuntu@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
          PAX_ENGINE=docker tools/e2fs --version

      - name: ext2 read (and, in the full and all tiers, written and rebooted) against Linux's and e2fsprogs'; the plan's legs
        env:
          PAX_REQUIRE_UEFI: "1"
          PAX_ENGINE: docker
        run: tests/mpx6-ext2 $PAX_LEGS

      - name: keep the programs' sums, the sessions, the disks' listings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx6-ext2-linux
          path: |
            build/mpx6-ext2/*.txt
            build/mpx6-ext2/linux/
            build/mpx6-ext2/*/kmain_console.elf
            build/mpx6-ext2/*/*.log
            build/mpx6-ext2-*.session
            build/mpx6-ext2-*.serial.log
            build/mpx6-ext2-*.verdict
            build/mpx6-ext2-*.img.tree
            build/mpx6-ext2-*.img.fsck*
            build/mpx6-ext2-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px79: block device nodes, the block ioctls and a second disk
  # (pax#144). kmain_console with up to three virtio disks: /dev's nodes,
  # stat, /proc/partitions and /sys's block files, the ioctls, raw I/O,
  # BLKRRPART and BLKPG, a pattern on every sector of a second disk, a
  # GPT written through a node and read again, mount(2) and /etc/fstab by
  # node, held to the Linux guest's answers recorded on kasumi
  # (tests/mpx6-nodes.d/linux/: the runner's kernel is root's to read).
  # The pr tier boots the nodes and gpt sessions; the full and all tiers
  # the numbers past 15 and the fstab boot too.
  mpx6-nodes:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx6-nodes')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
      PAX_NODES_ROWS: ${{ needs.plan.outputs.tier == 'pr' && 'pr' || 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils, gcc (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils gcc libc6-dev
          qemu-system-x86_64 --version
          gcc --version | head -n 1
          docker --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx6-nodes-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: e2fsprogs from the image pinned by digest
        run: |
          docker pull docker.io/library/ubuntu@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
          PAX_ENGINE=docker tools/e2fs --version

      - name: the nodes, the ioctls, raw I/O, the rescan, a second disk, mount by node, against the guest's; the plan's legs
        env:
          PAX_REQUIRE_UEFI: "1"
          PAX_ENGINE: docker
        run: tests/mpx6-nodes $PAX_LEGS

      - name: keep the sessions, the transcripts and the halt probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx6-nodes-linux
          path: |
            build/mpx6-nodes/*.txt
            build/mpx6-nodes/linux/
            build/mpx6-nodes/*/kmain_console.elf
            build/mpx6-nodes/*/*.log
            build/mpx6-nodes-*.session
            build/mpx6-nodes-*.serial.log
            build/mpx6-nodes-*.verdict
            build/mpx6-nodes-*.part.fsck
            build/mpx6-nodes-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px66: the partition table. kernel/block's GPT and MBR reading and its
  # windows, through kmain_part on eleven fixture disks (tools/mkgpt, the
  # same bytes everywhere; the oracles sfdisk and sgdisk from
  # user/disktools.pin in the image tools/e2fs pins), held to the Linux
  # guest's answers recorded on kasumi (tests/mpx6-part.d/linux/: the
  # runner's kernel is root's to read); and, in the full and all tiers,
  # the fstab spellings, a GPT disk (tools/mkdisk --gpt) booted with no
  # CD-ROM under SeaBIOS and OVMF, the ISO with a bare disk, and the ext2
  # clean flag after an exit, a reboot and a power cut.
  mpx6-part:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx6-part')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
      PAX_PART_ROWS: ${{ needs.plan.outputs.tier == 'pr' && 'table' || 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils, gcc (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils gcc libc6-dev
          qemu-system-x86_64 --version
          docker --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx6-part-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: e2fsprogs, and the partition and FAT tools, from the image and the packages pinned by digest
        run: |
          docker pull docker.io/library/ubuntu@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
          PAX_ENGINE=docker tools/e2fs --version
          PAX_ENGINE=docker tools/disktools --version

      - name: the table and its windows against the guest's (and, in the full and all tiers, the names, the disk that boots, the clean flag); the plan's legs
        env:
          PAX_REQUIRE_UEFI: "1"
          PAX_ENGINE: docker
        run: tests/mpx6-part $PAX_LEGS

      - name: keep the transcripts, the halt probes and the fixtures' dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx6-part-linux
          path: |
            build/mpx6-part/*/kmain_part.elf
            build/mpx6-part/*/kmain_console.elf
            build/mpx6-part/*/*.log
            build/mpx6-part/*/*.mkdisk.txt
            build/mpx6-part/fx/*.sfdisk
            build/mpx6-part/fx/*.sgdisk
            build/mpx6-part/linux/how
            build/mpx6-part-*.serial.log
            build/mpx6-part-*.meta
            build/mpx6-part-*.verdict
            build/mpx6-part-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px67: `/` on the disk. kmain_console booted from GPT disks made by
  # tools/mkdisk --gpt --root (the system installed onto partition 2, no
  # initramfs), `root=` in Linux's spellings: the mount table over the
  # disk, `..` at the root, mount(2) and umount2(2), the tree on the disk
  # against the archive's (tools/e2tree, debugfs), the end (SIGTERM, the
  # grace, SIGKILL) and the clean flag after it, held to the Linux guest
  # recorded on kasumi (tests/mpx6-root.d/linux/: the runner's kernel is
  # root's to read); and, in the full and all tiers, the other spellings,
  # /etc across a reboot, a power cut and the next boot, the ISO way.
  mpx6-root:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx6-root')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
      PAX_ROOT_ROWS: ${{ needs.plan.outputs.tier == 'pr' && 'pr' || 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils, gcc (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils gcc libc6-dev
          qemu-system-x86_64 --version
          docker --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx6-root-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: e2fsprogs, and the partition and FAT tools, from the image and the packages pinned by digest
        run: |
          docker pull docker.io/library/ubuntu@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
          PAX_ENGINE=docker tools/e2fs --version
          PAX_ENGINE=docker tools/disktools --version

      - name: / on the disk against the guest's and e2fsprogs' (and, in the full and all tiers, every spelling, the reboot, the power cut, the ISO way); the plan's legs
        env:
          PAX_REQUIRE_UEFI: "1"
          PAX_ENGINE: docker
        run: tests/mpx6-root $PAX_LEGS

      - name: keep the sessions, the halt probes and the disks' listings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx6-root-linux
          path: |
            build/mpx6-root/*/kmain_console.elf
            build/mpx6-root/*/*.log
            build/mpx6-root/*/disks/*.mkdisk.txt
            build/mpx6-root/*/disks/*.root-attrs
            build/mpx6-root/*/disks/main.diff.*
            build/mpx6-root/linux/how
            build/mpx6-root-*.serial.log
            build/mpx6-root-*.session
            build/mpx6-root-*.meta
            build/mpx6-root-*.verdict
            build/mpx6-root-*.fsck
            build/mpx6-root-runs.txt
          retention-days: 14
          if-no-files-found: warn

  # px68: the journal for `/` (ext3): kernel/journal's commits in the
  # order QEMU's own trace of the disk records, its replay held to
  # e2fsck -fy's on journals tools/mkjournal writes and on a power cut's,
  # the refusals by name, and a crash row gated (4 kills of 600
  # operations in tier pr, 12 of 1,500 and the torn row in the full and
  # all tiers); the Linux side is the record made on kasumi
  # (tests/mpx6-journal.d/linux/, Linux 7.3.0 with an ext3 root).
  mpx6-journal:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx6-journal')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
      PAX_JOURNAL_ROWS: ${{ needs.plan.outputs.tier == 'pr' && 'pr' || 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: qemu, ovmf, xorriso, clang, lld, binutils, gcc (apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils gcc libc6-dev
          qemu-system-x86_64 --version
          qemu-system-x86_64 -trace help | grep -c virtio_blk
          docker --version

      - uses: actions/cache@v4
        with:
          path: |
            .pax-cache/limine-*
          key: mpx6-journal-${{ hashFiles('boot/limine.pin') }}

      - name: wolf at the pin (the release archive, by digest)
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: fetch limine (by digest)
        run: tools/fetch-limine

      - name: e2fsprogs, and the partition and FAT tools, from the image and the packages pinned by digest
        run: |
          docker pull docker.io/library/ubuntu@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
          PAX_ENGINE=docker tools/e2fs --version
          PAX_ENGINE=docker tools/disktools --version

      - name: the journal against e2fsprogs', QEMU's trace and the guest's; the plan's legs
        env:
          PAX_REQUIRE_UEFI: "1"
          PAX_ENGINE: docker
        run: tests/mpx6-journal $PAX_LEGS

      - name: keep the sessions, the traces' verdicts, the crash rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx6-journal
          path: |
            build/mpx6-journal/*/kmain_console.elf
            build/mpx6-journal/*/*.log
            build/mpx6-journal/*/disks/*.mkdisk.txt
            build/mpx6-journal/linux/how
            build/mpx6-journal-*/*.jorder
            build/mpx6-journal-*/*.spec
            build/mpx6-journal-*/crash/crash.txt
            build/mpx6-journal-*-crash.txt
            build/mpx6-journal-*.serial.log
            build/mpx6-journal-*.verdict
            build/mpx6-journal-runs.txt

  # px69: three filesystem-format differentials and a disk built on PAX.
  mpx6-disktools:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'mpx6-disktools')
    env:
      PAX_LEGS: ${{ needs.plan.outputs.legs }}
      PAX_ROOT_ROWS: ${{ needs.plan.outputs.tier == 'pr' && 'pr' || 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: qemu, firmware, compiler and tracing tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf xorriso clang lld binutils gcc libc6-dev curl make strace
      - name: lope's pin
        id: lope
        run: |
          . user/lope.pin
          echo "rev=$LOPE_REV" >> "$GITHUB_OUTPUT"
      - name: require the private lope checkout token
        env:
          TOKEN: ${{ secrets.WOLF_CI_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::WOLF_CI_TOKEN is required for the playground's lope binary"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: wolffe-lang/lope
          ref: ${{ steps.lope.outputs.rev }}
          token: ${{ secrets.WOLF_CI_TOKEN }}
          path: .lope
          persist-credentials: false
      - name: pinned compiler and oracles
        run: |
          bin=$(tools/fetch-wolf)
          echo "PAX_WOLF=$bin" >> "$GITHUB_ENV"
          docker pull docker.io/library/ubuntu@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
          PAX_ENGINE=docker tools/e2fs --version
          PAX_ENGINE=docker tools/disktools --version
      - name: disk tools against Linux and then on PAX; the plan's legs
        env:
          PAX_REQUIRE_UEFI: "1"
          PAX_ENGINE: docker
          PAX_LOPE_REPO: ${{ github.workspace }}/.lope
        run: tests/mpx6-disktools $PAX_LEGS
      - name: explicit ext2 root leg with the Wolf writer
        env:
          PAX_REQUIRE_UEFI: "1"
          PAX_ENGINE: docker
        run: |
          PAX_EXT2_WRITER="$PWD/build/mpx6-disktools/bin/paxext2" tests/mpx6-root --fstype ext2 $PAX_LEGS
      - name: keep formatters, oracle verdicts and boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-mpx6-disktools
          path: |
            build/mpx6-disktools/**/*.log
            build/mpx6-disktools/**/*.serial
            build/mpx6-disktools/**/*.compare
            build/mpx6-disktools/**/*.session
            build/mpx6-disktools/**/*.tree
            build/mpx6-disktools/**/*.fsck
            build/mpx6-disktools/**/*.red
            build/mpx6-disktools/**/sums.txt
            build/mpx6-root-*.serial.log
            build/mpx6-root-*.session
            build/mpx6-root-*.verdict
            build/mpx6-root-runs.txt
          retention-days: 14
          if-no-files-found: error

  tier:
    name: tier ${{ needs.plan.outputs.tier || 'unplanned' }}
    if: ${{ !cancelled() }}
    needs:
      - plan
      - proof
      - macos-run
      - mkw
      - mpx1
      - census
      - mpx2-frames
      - mpx2-paging
      - mpx2-interrupts
      - mpx2-sched
      - mpx2-heap
      - mpx3-user
      - mpx3-loader
      - mpx3-boreutils
      - mpx3-console
      - mpx3-screen
      - mpx3-shell
      - mpx3-threads
      - mpx3-tree
      - mpx3-maps
      - mpx3-speaker
      - mpx3-sound
      - mpx3-orchestra
      - tour
      - mpx4-net
      - mpx4-udp
      - mpx4-tcp
      - mpx4-ready
      - mpx4-session
      - mpx4-unix
      - mpx4-lobo
      - mpx5-users
      - mpx5-accounts
      - mpx5-jobs
      - mpx5-lope
      - mpx5-pelt
      - mpx5-aspen
      - mpx5-scent
      - mpx5-bore
      - mpx5-lupin
      - mpx5-wolf
      - mpx5-yew
      - mpx5-screen
      - mpx6-blk
      - mpx6-ext2
      - mpx6-part
      - mpx6-root
      - mpx6-journal
      - mpx6-nodes
      - mpx6-disktools
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The issue step's token may write issues; nothing else.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: every chosen suite succeeded, every other was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: tools/ci-plan --verdict

      # A red nightly opens an issue (tl29, ruling #92): a scheduled run
      # has no lane watching it, and three of the four legs run nowhere
      # else before the next merge. One open issue per workflow, its title
      # the dedupe key; a further red night comments on it. Never on a
      # pull request, a push or a dispatch: those reds have a lane already.
      - name: a red nightly opens an issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: tools/nightly-red
